<!DOCTYPE html>
<!--
  ============================================================
   משחק: עומר על גלגלים 🛹🤖
   המשחק השני של עומר וסבא פיני, נבנה עם Claude Code
   הגרסה הראשונה: 17.10.2026
  ============================================================

  איך משחקים?
  - הרובוט נוסע לבד על הסקייטבורד ברחוב של העיר.
  - לוחצים על רווח (או חץ למעלה, קליק בעכבר, נגיעה במסך) כדי לקפוץ.
  - קופצים מעל המכשולים: קונוסים, פחי זבל וברזי כיבוי אש.
  - כל מכשול שעברתם = נקודה אחת. נתקעתם במכשול? המשחק נגמר.
  - ככל שמתקדמים, הרחוב זז יותר ויותר מהר!
  - 🤸 סלטה (רעיון של עומר): לוחצים שוב כשהרובוט באוויר, והוא מסתובב סיבוב שלם.
    סלטה שנגמרת לפני הנחיתה = בונוס נקודות!
  - 🪙 מטבעות (רעיון של עומר): מרחפים באוויר בין המכשולים. קופצים כדי לאסוף אותם.
  - 🧊 מראה תלת-ממדי (רעיון של עומר): לכל דבר יש צד מואר, צד בצל וצל על המדרכה.
  - 🔊 צלילים (רעיון של עומר): בוינג בקפיצה, דינג-דינג במטבע, בום כשנתקעים.
    הכפתור 🔊 ליד הניקוד (או המקש M) משתיק ומחזיר את הצלילים.
  - 🎁 פרס (רעיון של עומר): כל 3 מטבעות — המכשול הכי קרוב נעלם בפוף!
  - 🛹 רמפות (רעיון של עומר): נוסעים עליהן ועפים גבוה. למעלה מחכה קשת מטבעות סודית!
  - 🎚️ שלוש דרגות קושי (רעיון של סבא פיני): קל 🟢, בינוני 🟡, קשה 🔴. לכל דרגה שיא משלה.
    בדרגה קשה: נחיתה באמצע סלטה = נתקעים! (במקלדת: 1 / 2 / 3 בוחרים דרגה במסך הפתיחה)
  - 🌙 יום ולילה (הפתעה): העיר עוברת מבוקר לשקיעה וללילה, עם כוכבים, ירח, חלונות דולקים ופנס לרובוט.
  - 🛸 רחפנים (הפתעה): עפים בגובה הראש. לא קופצים — עוברים מתחתיהם!
  - ⚡ כוחות-על (הפתעה): בועות באוויר — מגנט 🧲 מושך מטבעות, מגן 🛡️ מציל מהתנגשות אחת, כפול ✖️2 לנקודות.
  - 🏆 חגיגת שיא (הפתעה): ברגע שעוברים את השיא — קונפטי ותרועה, כבר באמצע המשחק.
  - 🛒 חנות (רעיון של עומר): המטבעות נכנסים לקופה 💰, ובחנות קונים צבע לרובוט, סקייטבורד להבות
    או קשת, וכובע — מצחייה, פיראט או כתר 👑. בפעם הראשונה יש מתנת פתיחה!
  - 👤 שמות (רעיון של עומר): כותבים שם לפני שמשחקים, ולכל שם יש קופה, בגדים ושיאים משלו.
    ♾️ קוד צ׳יט: מי שכותב "עומר 24788" מקבל כסף בלי סוף! (השמות האלה ב-RICH_NAMES)
    👻 והוא יכול גם להדליק "רובוט רפאים" שעובר דרך הכול (עם שיא נפרד, וכפתור "לסיים").
  - ❤️ שלוש נשמות לכולם (רעיון של עומר): נתקעים — מאבדים לב וממשיכים. נגמרו הלבבות — המשחק נגמר.
  - 🛸 סקייטבורד מעופף (רעיון של עומר): בחנות. בלי גלגלים, ומחזיקים את הקפיצה כדי לרחף לאט למטה.
    ועוד בחנות: שובל נצנצים או קשת ✨, צבעים סגול ושחור, ואוזני חתול 🐱

  --- אזור ההגדרות (באותיות גדולות) נמצא בתחילת הסקריפט למטה ---
  שנו מספר או צבע, שמרו (Ctrl+S), ולחצו F5 בדפדפן כדי לראות מה קרה.
-->
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עומר על גלגלים 🛹</title>
  <style>
    /* ====== עיצוב הדף ====== */
    body {
      margin: 0;
      padding-top: 12px;
      min-height: 100vh;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(#e3f2fd, #bbdefb);
      color: #263238;
      text-align: center;
      overflow-x: hidden;
      user-select: none;
    }
    h1 { margin: 0 0 2px; font-size: 28px; }
    #help { font-size: 15px; opacity: .75; margin: 0 0 6px; }
    #scoreboard { font-size: 21px; margin: 6px; }
    /* כפתור הצלילים 🔊 */
    #soundBtn {
      font-size: 20px;
      margin-right: 10px;
      padding: 2px 8px;
      border: 2px solid #ff6d00;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      vertical-align: middle;
    }
    #soundBtn:hover { background: #fff3e0; }
    /* 🏁 כפתור "לסיים" של סיבוב רפאים */
    #stopBtn {
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      margin-right: 6px;
      padding: 3px 10px;
      border: 2px solid #5c6bc0;
      border-radius: 10px;
      background: #e8eaf6;
      color: #283593;
      cursor: pointer;
      vertical-align: middle;
    }
    /* מטבע קטן מצויר (כי לסמל 🪙 אין ציור ב-Windows 10) */
    /* מד הפרס: מטבעות אפורים שמתמלאים בזהב */
    .coin.empty {
      background: #eceff1;
      border-color: #b0bec5;
    }
    #prizeMeter .coin { margin: 0 1px; }
    .coin {
      display: inline-block;
      width: 0.8em;
      height: 0.8em;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff59d, #ffd600 45%, #ff8f00);
      border: 2px solid #ff8f00;
      vertical-align: -0.1em;
    }

    /* המסגרת שמחזיקה את המשחק ואת חלון הפתיחה שמעליו */
    #gameWrap {
      position: relative;
      display: inline-block;
      max-width: 96vw;
    }
    canvas {
      display: block;
      width: 800px;
      max-width: 96vw;
      height: auto;
      border: 4px solid #ff6d00;
      border-radius: 14px;
      touch-action: none;
      cursor: pointer;
    }

    /* רעידה קטנה של המסך כשהרובוט נתקע 💥 */
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-7px, 3px); }
      40% { transform: translate(6px, -5px); }
      60% { transform: translate(-5px, -3px); }
      80% { transform: translate(4px, 4px); }
    }
    canvas.shake { animation: shake 0.35s ease-in-out; }

    /* החלון שמופיע מעל המשחק: בהתחלה, וכשנתקעים */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #overlay.hidden { display: none; }
    .card {
      background: rgba(255, 255, 255, .93);
      padding: 20px 34px;
      border-radius: 18px;
      border: 3px solid #ff6d00;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    }
    .card .big   { font-size: 30px; font-weight: bold; margin-bottom: 8px; }
    .card .line  { font-size: 19px; margin: 6px 0; }
    .card .gold  { color: #e65100; font-weight: bold; }
    .card .small { font-size: 14px; opacity: .7; margin-top: 8px; }
    .bigBtn {
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      background: #ff6d00;
      color: white;
      cursor: pointer;
    }
    .bigBtn:hover { background: #e65100; }
    /* כפתורי הדרגות במסך הפתיחה 🟢🟡🔴 */
    .levels {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .levelBtn {
      flex: 1 1 130px;
      max-width: 180px;
      padding: 8px 10px;
      border: 3px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      color: #263238;
    }
    .levelBtn[data-level="easy"]   { background: #e8f5e9; }
    .levelBtn[data-level="medium"] { background: #fff8e1; }
    .levelBtn[data-level="hard"]   { background: #ffebee; }
    .levelBtn:hover { filter: brightness(0.95); }
    .levelBtn.chosen { border-color: #ff6d00; }
    .levelBtn b { display: block; font-size: 20px; }
    .levelBtn small { display: block; font-size: 12px; opacity: .8; margin-top: 2px; }
    /* 👤 השדה לשם של השחקן */
    #nameInput, .duelInput {
      font-family: inherit;
      font-size: 17px;
      width: 150px;
      padding: 5px 10px;
      border: 2px solid #90a4ae;
      border-radius: 10px;
      text-align: center;
      direction: rtl;
    }
    #nameInput:focus, .duelInput:focus { outline: none; border-color: #ff6d00; }
    #nameInput.missing, .duelInput.missing { border-color: #e53935; background: #ffebee; }
    /* 👥 הדו-קרב: הכפתור במסך הפתיחה, הטבלה של התוצאות והקונפטי של המנצח */
    .duelBtn { border-color: #7e57c2; background: #ede7f6; color: #4527a0; }
    .duelTable { display: inline-block; margin: 6px 0; font-size: 19px; text-align: right; }
    .duelTable div { padding: 3px 12px; border-radius: 10px; }
    .duelTable .winner { background: #fff8e1; font-weight: bold; }
    .duelWin { position: relative; overflow: hidden; }
    .confetti {
      position: absolute;
      top: -24px;
      font-size: 20px;
      pointer-events: none;
      animation: confettiFall 2.8s linear forwards;
    }
    @keyframes confettiFall { to { transform: translateY(330px) rotate(540deg); opacity: 0; } }
    #nameHint { color: #c62828; min-height: 0; margin: 0; }
    #nameHint:empty { display: none; }
    /* 🛒 החנות */
    .shopBtn {
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      padding: 4px 12px;
      border: 2px solid #ffb300;
      border-radius: 12px;
      background: #fff8e1;
      color: #e65100;
      cursor: pointer;
    }
    .shopHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .shopHead .big { margin: 0; }
    .bankTag {
      font-size: 18px;
      background: #fff8e1;
      border: 2px solid #ffb300;
      border-radius: 12px;
      padding: 4px 10px;
    }
    .shopBody { display: flex; gap: 12px; align-items: center; }
    #shopPreview {
      width: 150px;
      height: 170px;
      flex: none;
      border-radius: 12px;
      border: 2px solid #90caf9;
      background: linear-gradient(#e1f5fe, #b3e5fc);
    }
    .shelves { display: flex; flex-direction: column; gap: 6px; text-align: right; }
    .shelf { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .shelfName { font-weight: bold; font-size: 13px; min-width: 80px; }
    /* בחנות החלון קצת יותר צפוף, כדי שכל המדפים ייכנסו */
    .card.shopMode { padding: 12px 18px; }
    .card.shopMode .big { font-size: 26px; }
    .card.shopMode .bigBtn, .card.shopMode .menuBtn { margin-top: 6px; padding-top: 8px; padding-bottom: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: inherit;
      font-size: 12px;
      padding: 3px 6px;
      border: 2px solid #cfd8dc;
      border-radius: 10px;
      background: white;
      color: #263238;
      cursor: pointer;
    }
    .chip:hover { background: #fafafa; }
    .chip.trying { border-color: #ff6d00; background: #fff3e0; }
    .chip .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.2); }
    .chip .sw.board { width: 22px; height: 8px; border-radius: 4px; }
    .chip .price { color: #e65100; font-weight: bold; }
    .chip .tag { color: #2e7d32; }
    .chip .coin { font-size: 11px; }
    .card .stats { font-size: 16px; }
    /* הכפתור "דרגה אחרת" במסך הסיום */
    .menuBtn {
      margin-top: 10px;
      font-size: 16px;
      padding: 10px 16px;
      border: 2px solid #ff6d00;
      border-radius: 12px;
      background: white;
      color: #e65100;
      cursor: pointer;
      font-family: inherit;
    }

    /* במסך קטן (טלפון) — הכול קצת יותר קטן */
    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      #help { font-size: 12px; }
      #scoreboard { font-size: 15px; }
      #soundBtn { font-size: 16px; }
      /* בטלפון המשחק קטן, אז החלון מכסה את כל המסך במקום רק את המשחק */
      #overlay {
        position: fixed;
        background: rgba(0, 0, 0, .35);
        padding: 16px;
        z-index: 10;
        overflow-y: auto;            /* אם החלון ארוך מהמסך — אפשר לגלול בו */
        align-items: safe center;
      }
      .card { padding: 14px 16px; }
      .card .big  { font-size: 22px; }
      .card .line { font-size: 15px; }
      .bigBtn { font-size: 18px; padding: 10px 20px; }
      /* בטלפון: חלון המדידה מעל המדפים, ולא לידם */
      .shopBody { flex-direction: column; }
      #shopPreview { width: 120px; height: 136px; }
      .shelfName { min-width: 0; width: 100%; }
    }
    html { overflow-x: hidden; }
    body { touch-action: manipulation; }   /* בטלפון: נגיעה כפולה לא מגדילה את הדף */
  </style>
</head>
<body>

  <h1 id="title">עומר על גלגלים 🛹</h1>
  <p id="help">רווח / חץ למעלה / קליק = קפיצה · עוד לחיצה באוויר = סלטה 🤸</p>
  <div id="scoreboard">
    <span id="playerTag"></span>
    נקודות: <b id="score">0</b> &nbsp;|&nbsp; <span class="coin"></span> מטבעות: <b id="coins">0</b>
    &nbsp;|&nbsp; <span id="prizeMeter" title="כל כמה מטבעות = מכשול נעלם!"></span>
    &nbsp;|&nbsp; 🏆 שיא <span id="bestLevel"></span>: <b id="best">0</b>
    <button id="soundBtn" tabindex="-1">🔊</button>
    <button id="stopBtn" tabindex="-1" style="display:none">🏁 לסיים</button>
  </div>

  <div id="gameWrap">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>

<script>
// ============================================================
//  ⚙️ אזור ההגדרות — כאן הכי כיף לשנות!
//  שנו מספר, שמרו, ולחצו F5 כדי לראות מה קרה.
// ============================================================

// --- שם המשחק ---
const GAME_NAME = "עומר על גלגלים";

// --- דרגות קושי 🟢🟡🔴 (רעיון של סבא פיני) ---
// לכל דרגה יש הגדרות משלה:
//   START_SPEED  = כמה מהר הרחוב זז בהתחלה
//   SPEED_UP     = בכמה המהירות עולה בכל פעם שעוברים מכשול
//   MAX_SPEED    = הכי מהר שהרחוב יכול לזוז
//   GAP_MIN/MAX  = הכי מעט / הכי הרבה זמן בין שני מכשולים (קטן = צפוף)
//   RAMP_CHANCE  = הסיכוי שבמקום מכשול תופיע רמפה 🛹 (0 = אף פעם, 1 = רק רמפות)
//   DRONE_CHANCE = הסיכוי שהמכשול הבא יהיה רחפן 🛸 (עוברים מתחתיו — לא קופצים!)
//   POWER_CHANCE = הסיכוי שברווח גדול תופיע בועת כוח-על ⚡ (במקום קשת מטבעות)
//   FLIP_CRASH   = true: נחיתה באמצע סלטה = נתקעים! 😱  ·  false: רק "כמעט!"
const LEVELS = {
  easy:   { NAME: "קל",     ICON: "🟢", ABOUT: "לאט ובנחת, הרבה מטבעות",
            START_SPEED: 5, SPEED_UP: 0.1,  MAX_SPEED: 12, GAP_MIN: 60, GAP_MAX: 130, RAMP_CHANCE: 0.3,
            DRONE_CHANCE: 0.1,  POWER_CHANCE: 0.35, FLIP_CRASH: false },
  medium: { NAME: "בינוני", ICON: "🟡", ABOUT: "כמו שהיה עד עכשיו",
            START_SPEED: 6, SPEED_UP: 0.15, MAX_SPEED: 16, GAP_MIN: 50, GAP_MAX: 110, RAMP_CHANCE: 0.25,
            DRONE_CHANCE: 0.15, POWER_CHANCE: 0.3,  FLIP_CRASH: false },
  hard:   { NAME: "קשה",    ICON: "🔴", ABOUT: "מהיר וצפוף. נחיתה באמצע סלטה = נתקעים!",
            START_SPEED: 8, SPEED_UP: 0.25, MAX_SPEED: 20, GAP_MIN: 45, GAP_MAX: 100, RAMP_CHANCE: 0.2,
            DRONE_CHANCE: 0.22, POWER_CHANCE: 0.25, FLIP_CRASH: true }
};

// --- קפיצה ---
const JUMP_POWER = 16;        // כמה חזק הרובוט קופץ (מספר גדול = קפיצה גבוהה יותר)
const GRAVITY = 0.8;          // כוח המשיכה: כמה חזק מושכים את הרובוט חזרה למטה
                              // (נסו 0.3 — כמו לקפוץ על הירח! 🌙)

// --- נשמות ❤️ (רעיון של עומר) ---
const LIVES = 3;              // כמה פעמים אפשר להיתקע לפני שהמשחק נגמר
const HURT_SECONDS = 0.8;     // כמה זמן הרובוט מהבהב (ולא נפגע שוב) אחרי שאיבד נשמה

// --- סלטה 🤸 (רעיון של עומר) ---
const FLIP_SPEED = 15;        // בכמה מעלות הרובוט מסתובב בכל רגע (סיבוב שלם = 360 מעלות)
const TRICK_BONUS = 3;        // כמה נקודות בונוס מקבלים על סלטה שלמה

// --- מטבעות 🪙 (רעיון של עומר) ---
const COIN_VALUE = 1;         // כמה נקודות שווה כל מטבע
const COINS_IN_A_ROW = 3;     // כמה מטבעות יש בכל קשת באוויר
const COIN_CHANCE = 1;        // הסיכוי שתופיע קשת מטבעות כשיש מקום (1 = תמיד, 0.5 = חצי מהפעמים)
const COIN_COLOR = "#ffd600"; // הצבע של המטבע

// ⚡ שלושת כוחות-העל: הצבע של כל בועה והשם שלה
const POWERS = {

  shield: { color: "#1e88e5", name: "מגן!" },    // 🛡️ מציל מהתנגשות אחת

};

// מספר אקראי בין a ל-b
function rand(a, b) { return a + Math.random() * (b - a); }

// 🧊 הסוד של התלת-ממד: אותו צבע, רק בהיר יותר (באור) או כהה יותר (בצל).
// amount בין 1- ל-1: מינוס = כהה יותר, פלוס = בהיר יותר
function shade(hex, amount) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return hex;   // צבע שכתוב במילים (כמו "red") — משאירים כמו שהוא
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amount < 0) { r *= 1 + amount; g *= 1 + amount; b *= 1 + amount; }
  else { r += (255 - r) * amount; g += (255 - g) * amount; b += (255 - b) * amount; }
  return "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
}

// 🌙 כלים לערבוב צבעים — בשביל השמיים שמשתנים מבוקר לשקיעה וללילה
function hexToRgb(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return [128, 128, 128];
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixColor(a, b, t) {      // t = 0 ⇐ הצבע a,  t = 1 ⇐ הצבע b,  באמצע — ערבוב
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function rgbText(c, alpha) {
  return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," +
         (alpha === undefined ? 1 : alpha) + ")";
}
function rgbToHex(c) {            // [255, 128, 0] ⇐ "#ff8000"
  return "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
}

// צל על המדרכה. השמש למעלה מימין, אז הצל נופל קצת שמאלה
function drawShadow(cx, width, strength) {
  if (!SHADOWS) return;
  ctx.fillStyle = "rgba(0, 0, 0, " + strength + ")";
  ctx.beginPath();
  ctx.ellipse(cx - 7, GROUND_Y + 3, width / 2, Math.max(1.5, width / 9), 0, 0, Math.PI * 2);
  ctx.fill();
}

// ------------------------------------------------------------
//  🏙️ העיר ברקע: בניינים ועננים
// ------------------------------------------------------------
let buildings = [];      // הבניינים הקרובים (עם עומק, גג וחלונות)
let farBuildings = [];   // הבניינים הרחוקים מאחור (מעורפלים)
let clouds = [];
let stars = [];          // 🌙 הכוכבים של הלילה (מופיעים רק כשמחשיך)

// 🌍 העולם שאנחנו בו עכשיו (שורה מהטבלה WORLDS)
function world() {
  return WORLDS[worldIndex];
}
// 🌍 כוח המשיכה עכשיו: הרגיל, כפול הכוח של העולם (בחלל — חלש יותר)
function gravity() {
  return GRAVITY * world().GRAVITY;
}
// בוחרים דבר אחד באקראי מתוך רשימה
function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}
// 🌍 צבע באמצע המעבר בין העולם הקודם לחדש (key = איזה צבע: SKY_TOP, GROUND...)
function worldColor(key) {
  return mixColor(hexToRgb(WORLDS[prevWorldIndex][key]), hexToRgb(world()[key]), worldFade);
}

// 🌍 עברנו עוד WORLD_POINTS נקודות? עוברים לעולם הבא!
function checkWorld(dt) {
  if (worldFade < 1) worldFade = Math.min(1, worldFade + dt / 120);   // המעבר לוקח בערך 2 שניות
  const next = Math.floor(score / WORLD_POINTS) % WORLDS.length;
  if (next === worldIndex) return;
  prevWorldIndex = worldIndex;
  worldIndex = next;
  worldFade = 0;
  addPopup(world().ICON + " עולם חדש: " + world().NAME + "!", "rtl", "#00897b", 0, W / 2, 70, 0.006);
  if (world().SPACE) addPopup("🚀 כוח משיכה חלש — קופצים עד השמיים!", "rtl", "#5e35b1", 0, W / 2, 105, 0.006);
  soundPoof();
}

// ❄️ השלג: פתיתים חדשים נופלים מלמעלה, וזזים קצת עם הרוח
function updateSnow(dt) {
  if (world().SNOW && worldFade > 0.3 && Math.random() < 0.5 * dt) {
    flakes.push({ x: rand(0, W + 100), y: -5, vy: rand(0.8, 1.8), r: rand(1.5, 3.2), sway: rand(0, 6.28) });
  }
  for (const f of flakes) {
    f.y += f.vy * dt;
    f.x -= (speed * 0.3 + 0.4) * dt;
    f.sway += 0.05 * dt;
  }
  flakes = flakes.filter(f => f.y < GROUND_Y + 10 && f.x > -10);
}

// ✈️ הקישוטים: מדי פעם מופיע אחד חדש מימין, וטס לאט שמאלה (הם רחוקים — אז הם זזים לאט)
function updateDecor(dt) {
  const w = world();
  if (w.DECOR && Math.random() < DECOR_CHANCE * dt) {
    decor.push({ icon: pick(w.DECOR), sea: false, x: W + 30, y: rand(30, 170), size: rand(22, 34),
                 vx: rand(0.3, 1.2), wave: rand(0, 6.28) });
  }
  if (w.SEA && Math.random() < DECOR_CHANCE * 0.6 * dt) {
    decor.push({ icon: pick(w.SEA), sea: true, x: W + 30, y: GROUND_Y + 44, size: rand(20, 24),
                 vx: rand(0.1, 0.5), wave: rand(0, 6.28) });
  }
  for (const d of decor) {
    d.x -= (speed * (d.sea ? 0.6 : 0.25) + d.vx) * dt;
    d.wave += 0.05 * dt;
  }
  decor = decor.filter(d => d.x > -60);
}
// מציירים את הקישוטים: sea = false ⇐ אלה שבשמיים, sea = true ⇐ אלה שבים
function drawDecor(sea) {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.direction = "ltr";
  ctx.fillStyle = "#000";              // צבע מלא — כדי שהסמלים לא ייצאו שקופים
  for (const d of decor) {
    if (d.sea !== sea) continue;
    ctx.font = Math.round(d.size) + "px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif";
    const y = d.y + Math.sin(d.wave) * (sea ? 2 : 5);    // מתנדנדים קצת למעלה ולמטה
    ctx.save();
    ctx.translate(d.x, y);
    if (FLIP_ICONS.includes(d.icon)) ctx.scale(-1, 1);  // ✈️🚀 הופכים — שיטוסו שמאלה
    ctx.fillText(d.icon, 0, 0);
    ctx.restore();
  }
  ctx.textBaseline = "alphabetic";
  ctx.direction = "inherit";
}

function makeBuilding(x) {
  return {
    x: x,
    w: rand(60, 120),
    h: rand(90, 230),
    color: pick(world().BUILDINGS),     // 🌍 הצבעים של העולם שאנחנו בו
    seed: Math.floor(rand(0, 100)),     // בשביל לבחור אילו חלונות מבריקים
    solar: Math.random() < 0.5,         // האם יש על הגג דוד שמש? ☀️
    snow: !!world().SNOW                // ❄️ בעיר המושלגת — שלג על הגג
  };
}

function makeFarBuilding(x) {
  return {
    x: x,
    w: rand(40, 90),
    h: rand(150, 270),
    color: shade(world().FAR, rand(-0.1, 0.1)),
    seed: Math.floor(rand(0, 100))      // בשביל לבחור אילו חלונות דולקים בלילה
  };
}

// ממלאים שורה של בניינים לאורך כל המסך, ועוד קצת מימין
function fillLayer(maker, gapMin, gapMax) {
  const list = [];
  let x = -DEPTH;
  while (x < W + 200) {
    const b = maker(x);
    list.push(b);
    x += b.w + rand(gapMin, gapMax);
  }
  return list;
}

function buildCity() {
  buildings = fillLayer(makeBuilding, 4, 22);
  farBuildings = fillLayer(makeFarBuilding, 0, 8);
  // כמה עננים בשמיים
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({ x: rand(0, W), y: rand(30, 120), size: rand(0.7, 1.3) });
  }
  // כוכבים: נקודות קטנות שמנצנצות, כל אחת בקצב שלה
  stars = [];
  for (let i = 0; i < 70; i++) {
    stars.push({ x: rand(0, W), y: rand(5, 240), r: rand(0.6, 1.8), phase: rand(0, 6.28) });
  }
}
buildCity();

  speed = level.START_SPEED;

  obstacles = [];
  coins = [];

    worldIndex = 0;
    for (const b of buildings) { b.color = makeBuilding(0).color; b.snow = false; }
    for (const b of farBuildings) b.color = makeFarBuilding(0).color;
  }
  prevWorldIndex = 0;

  decor = [];
  powerups = [];

  droneHintShown = false;

  robot.y = GROUND_Y;
  robot.vy = 0;
  robot.onGround = true;
  robot.flipping = false;
  robot.flipAngle = 0;
  robot.crashed = false;
  robot.gliding = false;
  lives = LIVES;               // ❤️ כל משחק מתחיל עם כל הנשמות
  hurtTime = 0;
  jumpBuffer = 0;
  newRecord = false;

  if (skin.board === "hover") {
    addPopup("🛸 מחזיקים את הקפיצה = מרחפים!", "rtl", "#00838f", 0, W / 2, 60, 0.008);
  }

}

// 🎚️ בחירת דרגת קושי: מחליפים את ההגדרות, ואת השיא שמוצג (לכל דרגה שיא משלה)
function chooseLevel(key) {
  if (!LEVELS[key]) return;
  levelKey = key;
  level = LEVELS[key];
  saveLevel(key);
  best = loadBest();
  updateScoreboard();
}

function doJump() {
  robot.vy = -JUMP_POWER;   // דחיפה חזקה למעלה
  robot.onGround = false;
  robot.onRamp = null;      // אם קפצנו מאמצע רמפה — כבר לא נוסעים עליה
  jumpBuffer = 0;
  soundJump();              // בוינג! 🦘
}

// מה קורה כשלוחצים על כפתור הקפיצה — תלוי איפה אנחנו במשחק
function pressJump() {
  startAudio();             // הדפדפן מרשה צלילים רק אחרי שלוחצים על משהו — אז מדליקים את הרמקול עכשיו
  if (state === "start") {
    if (ensurePlayer()) startGame();         // 👤 מתחילים רק כשיש שם
    return;
  }
  if (state === "duelSetup") return;          // 👥 במסך ההכנה של הדו-קרב — בוחרים דרגה בכפתור
  if (state === "over") {
    // מחכים חצי שנייה אחרי שנתקעים, כדי שלחיצה של קפיצה לא תתחיל משחק חדש בטעות
    if (performance.now() - overTime > 600) {
      if (!duel) startGame();
      else if (duel.done) duelAgain();         // 👥 הדו-קרב נגמר — עוד סיבוב!
      else duelNext();                         // 👥 תור השחקן השני
    }
    return;
  }
  if (robot.onGround) doJump();
  else if (!robot.flipping && !almostLanding()) startFlip();   // לחיצה באוויר = סלטה! 🤸
  else jumpBuffer = 8;      // רגע לפני הנחיתה? נזכור את הלחיצה ונקפוץ ברגע שנוחתים
}

function startFlip() {
  robot.flipping = true;
  robot.flipAngle = 0;
}

// האם הרובוט עומד לנחות ממש עוד רגע? (אז לחיצה = קפיצה חדשה, לא סלטה)
function almostLanding() {
  return robot.vy > 0 && GROUND_Y - robot.y < robot.vy * 8;
}

// נתקענו! reason אומר למה: "" = במכשול, "drone" = ברחפן, "flip" = נחתנו באמצע סלטה
function crash(reason) {
  if (state !== "playing") return;   // כבר נתקענו — לא נתקעים פעמיים
  state = "over";
  crashReason = reason || "";
  robot.crashed = crashReason !== "stop";   // 🏁 מי שסיים סיבוב רפאים — לא "נתקע"
  if (crashReason !== "flip") robot.flipping = false;   // נחיתה על הראש — הרובוט נשאר הפוך 🙃
  robot.onRamp = null;
  overTime = performance.now();
  soundCrash();             // בום! 💥
  // רעידת מסך: מורידים את הרעידה ומחזירים אותה כדי שתתחיל מההתחלה
  canvas.classList.remove("shake");
  void canvas.offsetWidth;
  canvas.classList.add("shake");
  if (score > best) {
    best = score;
    newRecord = true;
    saveBest(best);
  }
  // 💰 המטבעות שאספנו נכנסים לקופה של החנות
  if (coinsCollected > 0) {
    bank += coinsCollected;
    saveProfile();
  }
  updateScoreboard();
  if (duel) duelTurnOver();   // 👥 בדו-קרב — עוברים לתור הבא (או מכריזים מי ניצח)
  else showOverScreen();
}

// ------------------------------------------------------------
//  🔊 צלילים — המחשב מנגן אותם בעצמו, בלי קבצי שמע!
//  צליל = רטט מהיר באוויר. כמה פעמים בשנייה הוא רוטט = כמה גבוה הצליל.
//  למשל 440 פעמים בשנייה = התו "לה". 880 = "לה" אחד גבוה יותר.
// ------------------------------------------------------------
let audio = null;               // הרמקול של המשחק (נדלק בלחיצה הראשונה)
let soundOn = loadSoundOn();    // האם הצלילים פתוחים? (הכפתור 🔊 / 🔇)

function startAudio() {
  try {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;          // דפדפן ישן בלי צלילים — המשחק עובד גם בלעדיהם
      audio = new AC();
    }
    if (audio.state === "suspended") audio.resume();
  } catch (e) {}
}

// צליל אחד: "גל" (wave) שמתחיל בגובה from ומחליק לגובה to, לאורך time שניות.
// סוגי גלים: "square" (צליל של משחק ישן), "sine" (רך), "sawtooth" (חורק), "triangle" (עגול)
function beep(wave, from, to, time, delay, volume) {
  if (!audio || !soundOn) return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();     // המכשיר שמייצר את הרטט
  const gain = audio.createGain();          // כפתור העוצמה
  osc.type = wave;
  osc.frequency.setValueAtTime(from, t);
  osc.frequency.exponentialRampToValueAtTime(to, t + time);
  gain.gain.setValueAtTime(VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + time);   // הצליל דועך עד שקט
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(t);
  osc.stop(t + time + 0.05);
}

// רעש (כמו "ששששש") — בשביל הבום של הנתקעות
function noise(time, volume) {
  if (!audio || !soundOn) return;
  const t = audio.currentTime;
  const buffer = audio.createBuffer(1, Math.floor(audio.sampleRate * time), audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;   // מספרים אקראיים = רעש
  const src = audio.createBufferSource();
  src.buffer = buffer;
  const filter = audio.createBiquadFilter();  // מסנן שמשאיר רק את הצלילים הנמוכים, ככה זה נשמע "בום"
  filter.type = "lowpass";
  filter.frequency.value = 800;
  const gain = audio.createGain();
  gain.gain.setValueAtTime(VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + time);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);
  src.start(t);
}

function soundJump() {          // 🦘 בוינג — צליל שעולה למעלה
  beep("square", 250, JUMP_SOUND_HIGH, 0.16, 0, 0.25);
}
function soundCoin() {          // 🪙 דינג-דינג — שני צלילים גבוהים, השני יותר גבוה
  beep("square", 988, 988, 0.08, 0, 0.22);
  beep("square", 1319, 1319, 0.3, 0.08, 0.22);
}
function soundCrash() {         // 💥 בום, וצליל עצוב שיורד למטה
  noise(0.45, 0.9);
  beep("sawtooth", 220, 55, 0.55, 0, 0.35);
}
function soundRamp() {          // 🚀 ווּוּש — צליל ארוך שעולה, כמו טיל
  beep("triangle", 180, 900, 0.45, 0, 0.5);
  beep("square", 360, 1400, 0.3, 0.05, 0.1);
}
function soundPower() {         // ⚡ כוח-על — צליל שעולה מהר ונוצץ בסוף
  beep("square", 300, 1200, 0.18, 0, 0.18);
  beep("triangle", 1200, 1800, 0.25, 0.15, 0.4);
}
function soundHurt() {          // 💔 איבדנו נשמה — "אאוץ'" קצר
  beep("square", 420, 140, 0.25, 0, 0.3);

}
function soundShield() {        // 🛡️ המגן נשבר — "פינג" של זכוכית
  beep("sine", 1900, 700, 0.35, 0, 0.5);

}
function soundRecord() {        // 🏆 שיא חדש — תרועת ניצחון קטנה
  const notes = [523, 659, 784, 1047, 784, 1047];
  const times = [0, 0.12, 0.24, 0.36, 0.52, 0.62];
  for (let i = 0; i < notes.length; i++) {
    beep("square", notes[i], notes[i], i === notes.length - 1 ? 0.4 : 0.12, times[i], 0.18);
  }
}
function soundBuy() {           // 🛒 קנייה — "צ'ה-צ'ינג" של קופה
  beep("square", 1046, 1046, 0.08, 0, 0.2);
  beep("square", 1568, 1568, 0.25, 0.08, 0.2);
  beep("triangle", 523, 1046, 0.3, 0.16, 0.3);
}
function soundPoof() {          // 🎁 קסם — ארבעה צלילים שעולים כמו מדרגות (דו, מי, סול, דו)
  const notes = [523, 659, 784, 1047];
  for (let i = 0; i < notes.length; i++) {
    beep("triangle", notes[i], notes[i], 0.18, i * 0.07, 0.45);
  }
}

// לוחצים על דרגה במסך ההכנה — בודקים את השמות ומתחילים
function startDuel(key) {
  const inA = document.getElementById("duelA");
  const inB = document.getElementById("duelB");
  const a = cleanName(inA.value);
  const b = cleanName(inB.value);
  const hint = document.getElementById("nameHint");
  if (!a || !b) {                                  // חסר שם? מסמנים באדום
    if (!a) inA.classList.add("missing");
    if (!b) inB.classList.add("missing");
    hint.textContent = "✍️ כתבו את השמות של שני השחקנים";
    return;
  }
  if (a.toLowerCase() === b.toLowerCase()) {       // אותו שם פעמיים — אי אפשר לשחק נגד עצמך 😄
    inB.classList.add("missing");
    hint.textContent = "✍️ צריך שני שמות שונים";
    return;
  }
  duelNames = [a, b];
  // מי שיש לו כסף בלי סוף נטען ראשון — כדי שהשיאים הישנים במכשיר יעברו אליו, ולא לשחקן השני
  for (const n of [a, b].sort((x, y) => richName(y) - richName(x))) loadProfile(n);
  duel = { names: [a, b], scores: [null, null], turn: 0, done: false, prevPlayer: player };
  startAudio();
  chooseLevel(key);
  startDuelTurn();
}

// מתחילים את התור של השחקן שעכשיו תורו
function startDuelTurn() {
  usePlayer(duel.names[duel.turn]);
  startGame();
  addPopup("👤 תור של " + duel.names[duel.turn] + "!", "rtl", "#4527a0", 0, W / 2, 100, 0.008);
  if (duel.turn === 1) {                           // לשחקן השני מזכירים כמה צריך לעבור
    addPopup("🎯 צריך לעבור " + duel.scores[0], "rtl", "#e65100", 0, W / 2, 135, 0.008);
  }
}

// התור נגמר: שומרים את הנקודות. אחרי השחקן הראשון — מחכים לשני. אחרי השני — מכריזים!
function duelTurnOver() {
  duel.scores[duel.turn] = score;
  if (duel.turn === 0) {
    const [a, b] = duel.names;
    card.classList.remove("shopMode");
    card.innerHTML =
      '<div class="big">👏 ' + escapeHtml(a) + ': <span class="gold">' + score + '</span> נקודות!</div>' +
      overStats() +
      (newRecord ? '<div class="line gold">🏆 וזה גם שיא חדש!</div>' : '') +
      '<div class="line">עכשיו תור של <b>' + escapeHtml(b) + '</b> — צריך לעבור <b>' + score + '</b> 🎯</div>' +
      '<button class="bigBtn" data-duelnext="1">' + escapeHtml(b) + ', יאללה! ▶️</button>' +
      (TOUCH ? '' : '<div class="small">(או לחצו רווח)</div>');
    overlay.classList.remove("hidden");
    return;
  }
  duel.done = true;
  showDuelWinner();
}

// 👑 מסך המנצח: הטבלה, כתר, קונפטי ותרועה
function showDuelWinner() {
  const [a, b] = duel.names;
  const [sa, sb] = duel.scores;
  const win = sa > sb ? 0 : sb > sa ? 1 : -1;     // -1 = תיקו
  const row = i => '<div' + (i === win ? ' class="winner"' : '') + '>' +
                   (i === win ? '👑 ' : '') + escapeHtml(duel.names[i]) + ': ' + duel.scores[i] + '</div>';
  let confetti = "";
  const bits = ["🎉", "🎊", "⭐", "✨", "🎈"];
  for (let i = 0; i < 24; i++) {
    confetti += '<span class="confetti" style="left:' + Math.round(rand(0, 95)) + '%;animation-delay:' +
                rand(0, 1.2).toFixed(2) + 's">' + bits[i % bits.length] + '</span>';
  }
  card.classList.remove("shopMode");
  card.innerHTML =
    '<div class="duelWin">' + confetti +
    (win < 0 ? '<div class="big">🤝 תיקו! שניכם אלופים!</div>'
             : '<div class="big">👑 הניצחון של ' + escapeHtml(duel.names[win]) + '!</div>') +
    '<div class="duelTable">' + row(0) + row(1) + '</div>' +
    '<div><button class="bigBtn" data-duelagain="1">עוד דו-קרב! 🔄</button> ' +
    '<button class="menuBtn" data-menu="1">🏠 למסך הפתיחה</button></div>' +
    (TOUCH ? '' : '<div class="small">(או לחצו רווח)</div>') +
    '</div>';
  overlay.classList.remove("hidden");
  soundRecord();                                   // תרועת ניצחון 🎺
}

// תור השחקן השני
function duelNext() {
  if (!duel || duel.turn !== 0 || duel.scores[0] === null) return;
  duel.turn = 1;
  startDuelTurn();
}

// עוד דו-קרב — עם אותם שמות ואותה דרגה
function duelAgain() {
  if (!duel) return;
  duel.scores = [null, null];
  duel.turn = 0;
  duel.done = false;
  startDuelTurn();
}

// יוצאים מהדו-קרב וחוזרים לשחקן שהיה לפני
function endDuel() {
  if (!duel) return;
  const prev = duel.prevPlayer;
  duel = null;
  if (prev) usePlayer(prev);
}

const SHOP_SHELVES = [["color", "🎨 צבע"], ["board", "🛹 סקייטבורד"], ["trail", "✨ שובל"], ["hat", "🎩 כובע"]];

function openShop() {

}

function closeShop() {
  shopOpen = false;
  card.classList.remove("shopMode");

}

// דוגמית קטנה של כל פריט: עיגול בצבע, פס של הסקייטבורד, או סמל של הכובע
function swatch(cat, it) {
  if (cat === "color") return '<span class="sw" style="background:' + it.body + '"></span>';
  if (cat === "board") {
    const bg = it.id === "flames" ? "linear-gradient(90deg,#b71c1c,#ff6d00,#ffea00)" :
               it.id === "rainbow" ? "linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa)" :
               it.id === "hover" ? "linear-gradient(90deg,#5e35b1,#00e5ff)" :
               it.paint ? "linear-gradient(90deg," + it.paint.join(",") + ")" :
               BOARD_COLOR;
    return '<span class="sw board" style="background:' + bg + '"></span>' + (it.id === "hover" ? "🛸" : "");
  }
  if (cat === "trail") {
    if (it.id === "none") return '<span class="hatIcon">—</span>';
    const bg = it.id === "rainbow" ? "linear-gradient(90deg,#e53935,#fdd835,#43a047,#1e88e5,#8e24aa)" :
               it.colors ? "radial-gradient(circle," + it.colors[0] + " 25%," + it.colors[2] + " 75%)" :
                           "radial-gradient(circle,#fff59d 30%,#ffb300 70%)";
    return '<span class="sw" style="background:' + bg + '"></span>';
  }
  const icons = { none: "—", cap: "🧢", cat: "🐱", pirate: "☠", crown: "👑", party: "🎉", wizard: "🧙", unicorn: "🦄", halo: "😇" };
  return '<span class="hatIcon">' + (icons[it.id] || "🎩") + '</span>';
}

function renderShop() {
  let shelves = "";
  for (const [cat, title] of SHOP_SHELVES) {
    let chips = "";
    for (const it of SHOP[cat]) {
      const own = isOwned(cat, it.id);
      const worn = skin[cat] === it.id;
      chips +=
        '<button class="chip' + (shopTry[cat] === it.id ? ' trying' : '') + '" data-cat="' + cat + '" data-id="' + it.id + '">' +
        swatch(cat, it) + it.name +
        (worn ? ' <b class="tag">✓</b>' : own ? '' : ' <span class="price">' + it.price + '</span><span class="coin"></span>') +
        '</button>';
    }
    shelves += '<div class="shelf"><span class="shelfName">' + title + '</span>' + chips + '</div>';
  }
  let buy = "";
  if (shopPick) {
    const it = findItem(shopPick.cat, shopPick.id);
    buy = '<button class="bigBtn" data-buy="1">לקנות ב-' + it.price + ' <span class="coin"></span></button> ';
  }
  card.innerHTML =
    '<div class="shopHead"><span class="big">🛒 החנות של הרובוט</span>' +
    '<span class="bankTag">💰 בקופה: <b>' + bankText() + '</b> <span class="coin"></span></span></div>' +
    '<div class="shopBody"><canvas id="shopPreview" width="150" height="170"></canvas>' +
    '<div class="shelves">' + shelves + '</div></div>' +
    '<div class="line ' + (shopMsg ? 'gold' : 'small') + '">' +
      (shopMsg || (shopTry.board === "hover" ? '🛸 הסקייטבורד המעופף: מחזיקים את הקפיצה — ומרחפים!'
                                             : 'לוחצים על פריט — והרובוט מודד אותו 👀')) + '</div>' +
    '<div>' + buy + '<button class="menuBtn" data-shop-close="1">סיימתי ✔</button></div>';
  card.classList.add("shopMode");
  overlay.classList.remove("hidden");
}

// לחצו על פריט: הרובוט מודד אותו. אם כבר קנינו אותו — הוא גם לובש אותו
function shopClick(cat, id) {
  shopTry = Object.assign({}, skin);
  shopTry[cat] = id;
  shopMsg = "";
  if (isOwned(cat, id)) {
    skin[cat] = id;
    saveProfile();
    shopPick = null;
  } else {
    shopPick = { cat: cat, id: id };
  }
  renderShop();
}

// לקנות: אם יש מספיק מטבעות בקופה — הפריט שלנו, והרובוט לובש אותו
function shopBuy() {
  if (!shopPick) return;
  const it = findItem(shopPick.cat, shopPick.id);
  if (!isRich() && bank < it.price) {
    shopMsg = "חסרים עוד " + (it.price - bank) + " מטבעות. עוד קצת משחק ותגיע לזה! 💪";
  } else {
    if (!isRich()) bank -= it.price;          // ♾️ למי שיש כסף בלי סוף — הקופה לא יורדת
    owned.push(shopPick.cat + ":" + shopPick.id);
    skin[shopPick.cat] = shopPick.id;
    saveProfile();
    shopMsg = "🎉 קנית: " + it.name + "! הרובוט כבר לובש את זה";
    shopPick = null;
    soundBuy();
  }
  renderShop();
}

function updateScoreboard() {
  scoreEl.textContent = score;
  coinsEl.textContent = coinsCollected;
  bestEl.textContent = best;
  bestLevelEl.textContent = level.ICON;   // ליד השיא: באיזו דרגה הוא
  // 👤 מי משחק עכשיו (ולמי שיש כסף בלי סוף — גם ∞)
  playerTagEl.innerHTML = player ? "👤 <b>" + escapeHtml(player) + "</b>" + (isRich() ? " ♾️" : "") +
                                   (ghostActive() ? " 👻" : "") + " &nbsp;|&nbsp; " : "";
  if (ghostActive()) bestLevelEl.textContent = level.ICON + "👻";           // שיא הרפאים
  stopBtn.style.display = state === "playing" && ghostActive() ? "" : "none";   // 🏁 רק בסיבוב רפאים
  // מד הפרס: כמה מטבעות כבר יש לנו בדרך לפרס הבא (זהב = יש, אפור = עוד חסר)
  const filled = coinsCollected % prizeEvery();
  let meter = "🎁 ";
  for (let i = 0; i < prizeEvery(); i++) {
    meter += '<span class="coin' + (i < filled ? '' : ' empty') + '"></span>';
  }
  prizeMeterEl.innerHTML = meter;
}

// כל כמה מטבעות מקבלים פרס (לפחות 1, כדי שהחשבון לא יתבלבל)
function prizeEvery() {
  return Math.max(1, Math.round(COINS_FOR_PRIZE));
}

// ------------------------------------------------------------
//  👤 שחקנים: לכל שם יש פרופיל משלו — קופה, מה קנה, מה הרובוט לובש, ושיא לכל דרגה
// ------------------------------------------------------------
function profileKey(name) { return "omer-skate-profile:" + name; }

function emptyProfile() {
  return { bank: 0, owned: [], skin: { color: "silver", board: "orange", trail: "none", hat: "none" }, gift: false,
           best: { easy: 0, medium: 0, hard: 0 } };
}

// מסדרים פרופיל: משלימים מה שחסר, ומחליפים פריט שכבר לא קיים בחנות בבגדים הרגילים
function fixProfile(p) {
  const fresh = emptyProfile();
  p = Object.assign(fresh, p);
  p.skin = Object.assign(emptyProfile().skin, p.skin);
  p.best = Object.assign(emptyProfile().best, p.best);
  if (!Array.isArray(p.owned)) p.owned = [];
  for (const cat of Object.keys(SHOP)) {
    if (!findItem(cat, p.skin[cat])) p.skin[cat] = SHOP[cat][0].id;
  }
  return p;
}

// מה שנשמר במחשב הזה לפני שהיו שמות (שיאים, קופה ובגדים)
function oldSavedData() {
  const num = key => parseInt(loadJSON(key, 0)) || 0;
  return fixProfile({
    bank: num("omer-skate-bank"),
    owned: loadJSON("omer-skate-owned", []),
    skin: loadJSON("omer-skate-skin", {}),
    gift: loadJSON("omer-skate-gift", false),
    best: { easy: num("omer-skate-best-easy"), medium: num("omer-skate-best"), hard: num("omer-skate-best-hard") }
  });
}

// טוענים את הפרופיל של שחקן. שחקן חדש מקבל פרופיל ריק —
// חוץ מהשחקן הראשון במחשב, שמקבל את כל מה שנשמר לפני שהיו שמות
function loadProfile(name) {
  if (!name) return emptyProfile();
  const saved = loadJSON(profileKey(name), null);
  if (saved) return fixProfile(saved);
  // 🔐 השם הסודי נכתב בפעם הראשונה? מעבירים אליו את כל מה שהיה לעומר: קניות, בגדים ושיאים
  const oldRich = richName(name) ? loadJSON(profileKey(OLD_RICH_NAME), null) : null;
  if (oldRich) {
    const p = fixProfile(oldRich);
    saveJSON(profileKey(name), p);
    return p;
  }
  let p = emptyProfile();
  if (!loadJSON("omer-skate-migrated", false)) {
    p = oldSavedData();
    saveJSON("omer-skate-migrated", true);
  }
  saveJSON(profileKey(name), p);
  return p;
}

// שומרים את הפרופיל של השחקן שמשחק עכשיו
function saveProfile() {
  if (!player) return;
  profile.bank = bank;
  profile.owned = owned;
  profile.skin = skin;
  saveJSON(profileKey(player), profile);
}

// מנקים שם: בלי רווחים מיותרים, ועד 12 אותיות
function cleanName(name) {
  return String(name || "").replace(/\s+/g, " ").trim().slice(0, 12);
}

// עוברים לשחקן (לפי השם). מחזיר false אם אין שם
function usePlayer(name) {
  name = cleanName(name);
  if (!name) return false;
  if (name !== player) {
    player = name;
    saveJSON("omer-skate-player", player);
    profile = loadProfile(player);
    bank = profile.bank;
    owned = profile.owned;
    skin = profile.skin;
  }
  best = loadBest();
  updateScoreboard();
  return true;
}

// ♾️ האם לשחקן הזה יש כסף בלי סוף? (השמות ב-RICH_NAMES בראש הקוד)
function isRich() {
  return richName(player);
}
function richName(name) {
  return RICH_NAMES.some(n => n.toLowerCase() === String(name).toLowerCase());
}
// 👻 האם הרובוט רפאים פועל עכשיו? (רק למי שיש לו כסף בלי סוף, ורק אם לא כיבה את המתג. בדו-קרב — אף פעם)
function ghostActive() {
  return !duel && isRich() && profile.ghost !== false;
}
// כמה כסף בקופה — כמספר, או ∞ למי שיש לו כסף בלי סוף
function bankText() {
  return isRich() ? "∞" : String(bank);
}

// שם שמכניסים לתוך HTML — בלי סימנים שיכולים לשבור את הדף
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// השיא של השחקן בדרגה הנוכחית. 👻 למשחקי רפאים יש שיא נפרד, כדי שהשיא האמיתי לא ייעלם
function bestSlot() {
  return ghostActive() ? levelKey + "Ghost" : levelKey;
}
function loadBest() {
  return (profile.best && profile.best[bestSlot()]) || 0;
}
function saveBest(value) {
  profile.best[bestSlot()] = value;
  saveProfile();
}

// 👻 המתג במסך הפתיחה: מדליקים או מכבים את הרובוט רפאים
function toggleGhost() {
  profile.ghost = !ghostActive();
  saveProfile();
  best = loadBest();
  showStartScreen();
  updateScoreboard();
}

// 🏁 בסיבוב רפאים המשחק לא נגמר לבד — אז מסיימים אותו בכפתור (או ב-Escape)
function stopGhostRun() {
  if (state === "playing" && ghostActive()) crash("stop");
}
// 🛒 שמירה וקריאה של דברים מסובכים יותר (רשימות ואוספים) בזיכרון של הדפדפן
function loadJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value === null || value === undefined ? fallback : value;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
function findItem(cat, id) {
  return SHOP[cat].find(it => it.id === id);
}
function isOwned(cat, id) {
  const it = findItem(cat, id);
  return !!it && (it.price === 0 || owned.indexOf(cat + ":" + id) >= 0);
}
// המראה של הרובוט עכשיו: הצבעים, הסקייטבורד והכובע
function currentLook() {
  const s = lookOverride || skin;
  const color = findItem("color", s.color) || SHOP.color[0];
  return { body: color.body, dark: color.dark, board: s.board, trail: s.trail || "none", hat: s.hat };
}

// הדפדפן זוכר איזו דרגה בחרנו בפעם האחרונה
function loadLevel() {
  try { const k = localStorage.getItem("omer-skate-level"); return LEVELS[k] ? k : "medium"; }
  catch (e) { return "medium"; }
}
function saveLevel(key) {
  try { localStorage.setItem("omer-skate-level", key); } catch (e) {}
}

// ------------------------------------------------------------
//  🎯 המקלדת, העכבר והמגע
// ------------------------------------------------------------
document.addEventListener("keydown", function (e) {
  // 👥 כותבים שמות לדו-קרב — המקשים רק כותבים אותיות
  if (e.target && e.target.classList && e.target.classList.contains("duelInput")) {
    e.target.classList.remove("missing");
    return;
  }
  // 👤 כותבים את השם — המקשים כותבים אותיות ולא מקפיצים את הרובוט. Enter = מתחילים לשחק!
  if (e.target && e.target.id === "nameInput") {
    e.target.classList.remove("missing");
    if (e.key === "Enter" && !e.repeat) {
      e.preventDefault();
      if (ensurePlayer()) { startAudio(); startGame(); }
    }
    return;
  }
  // 🛒 כשהחנות פתוחה — המקשים לא מתחילים משחק (Escape = סוגרים את החנות)
  if (shopOpen) {
    if (e.code === "Space" || e.code === "ArrowUp") e.preventDefault();
    if (e.code === "Escape") closeShop();
    if (e.code === "KeyM" && !e.repeat) toggleSound();
    return;
  }
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();               // שהרווח לא יגלול את הדף
    jumpHeld = true;                  // 🛸 מחזיקים את הקפיצה (בשביל הריחוף)
    if (!e.repeat) pressJump();       // לחיצה ארוכה = קפיצה אחת בלבד
  }
  if (e.code === "KeyM" && !e.repeat) toggleSound();   // M = השתקה / צלילים
  if (e.code === "Escape") stopGhostRun();             // 🏁 Escape = מסיימים סיבוב רפאים
  // 1 / 2 / 3 = בחירת דרגה (רק כשלא באמצע משחק)
  const digits = { Digit1: "easy", Digit2: "medium", Digit3: "hard", Numpad1: "easy", Numpad2: "medium", Numpad3: "hard" };
  if (digits[e.code] && state !== "playing" && state !== "duelSetup" && !duel && !e.repeat) {
    if (!ensurePlayer()) return;
    startAudio();
    chooseLevel(digits[e.code]);
    startGame();
  }
});
canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  jumpHeld = true;                    // 🛸 מחזיקים את האצבע / העכבר על המשחק
  pressJump();
});
// 🛸 עוזבים את הקפיצה — מפסיקים לרחף
document.addEventListener("keyup", function (e) {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jumpHeld = false;
});
window.addEventListener("pointerup", function () { jumpHeld = false; });
window.addEventListener("pointercancel", function () { jumpHeld = false; });
window.addEventListener("blur", function () { jumpHeld = false; });
// לחיצה על החלון שמעל המשחק: כפתור דרגה, כפתור "דרגה אחרת", חנות, או סתם לחיצה (= עוד פעם)
overlay.addEventListener("click", function (e) {
  if (e.target.closest("input")) return;     // 👤 לחיצה על השדה של השם — רק כותבים, לא מתחילים
  const btn = e.target.closest("button");
  // 🛒 בתוך החנות: פריט, קנייה או "סיימתי". לחיצה על מקום ריק לא עושה כלום
  if (shopOpen) {
    if (!btn) return;
    if (btn.dataset.cat) shopClick(btn.dataset.cat, btn.dataset.id);
    else if (btn.dataset.buy) shopBuy();
    else if (btn.dataset.shopClose) closeShop();
    return;
  }
  if (btn && btn.dataset.ghost) {            // 👻 המתג של הרובוט רפאים
    toggleGhost();
    return;
  }
  if (btn && btn.dataset.shopOpen) {
    if (!ensurePlayer()) return;             // לחנות נכנסים עם שם — כי לכל שחקן קופה משלו
    startAudio();
    openShop();
    return;
  }
  // 👥 הדו-קרב: לפתוח את מסך ההכנה, לבחור דרגה, תור הבא, או עוד סיבוב
  if (btn && btn.dataset.duel) {
    startAudio();
    showDuelSetup();
    return;
  }
  if (btn && btn.dataset.duellevel) {
    startDuel(btn.dataset.duellevel);
    return;
  }
  if (btn && btn.dataset.duelnext) {
    duelNext();
    return;
  }
  if (btn && btn.dataset.duelagain) {
    duelAgain();
    return;
  }
  if (btn && btn.dataset.level) {
    if (!ensurePlayer()) return;
    startAudio();
    chooseLevel(btn.dataset.level);
    startGame();
    return;
  }
  if (btn && btn.dataset.menu) {
    endDuel();                               // 👥 אם היינו בדו-קרב — יוצאים ממנו
    showStartScreen();
    return;
  }
  pressJump();
});

// ------------------------------------------------------------
//  🔄 העדכון: מה זז בכל רגע במשחק
// ------------------------------------------------------------
function update(dt) {
  // 1. הרחוב זז אחורה — וככה נראה שהרובוט נוסע קדימה
  roadOffset += speed * dt;

  // 2. הבניינים זזים לאט יותר מהרחוב, כי הם רחוקים — והבניינים הכי רחוקים זזים הכי לאט.
  //    ככה העין מרגישה עומק (זה נקרא "פרלקסה")
  moveLayer(buildings, 0.35, makeBuilding, 4, 22, dt);
  moveLayer(farBuildings, 0.15, makeFarBuilding, 0, 8, dt);
  // והעננים הכי רחוקים — זזים הכי לאט
  for (const c of clouds) {
    c.x -= speed * 0.1 * dt;
    if (c.x < -80) { c.x = W + 80; c.y = rand(30, 120); }
  }

  // 🌙 השעון של העיר מתקדם: בוקר ⇐ שקיעה ⇐ לילה ⇐ זריחה ⇐ ושוב בוקר
  dayClock = (dayClock + dt / (Math.max(5, DAY_NIGHT_SECONDS) * 60)) % 1;
  checkWorld(dt);           // 🌍 הגענו לעולם חדש?
  updateSnow(dt);           // ❄️
  updateDecor(dt);          // ✈️

  // ⚡ הטיימרים של כוחות-העל סופרים אחורה. כשמגיעים לאפס — הכוח נגמר
  if (magnetTime > 0) magnetTime = Math.max(0, magnetTime - dt);
  if (doubleTime > 0) doubleTime = Math.max(0, doubleTime - dt);
  if (hurtTime > 0) hurtTime = Math.max(0, hurtTime - dt);   // 💔 ההבהוב אחרי פגיעה נגמר לאט

  // 3. הסלטה: בכל רגע הרובוט מסתובב עוד קצת, עד שמגיע ל-360 מעלות (סיבוב שלם)
  if (robot.flipping) {
    robot.flipAngle += FLIP_SPEED * dt;
    if (robot.flipAngle >= 360) {
      robot.flipping = false;
      robot.flipAngle = 0;
      tricks++;
      const got = addScore(TRICK_BONUS);
      addPopup("סלטה!", "rtl", "#7b1fa2", 30);
      addPopup("+" + got, "ltr", "#7b1fa2", 0);
      updateScoreboard();
    }
  }

  // 4. הקפיצה וכוח המשיכה
  if (!robot.onGround) {
    robot.vy += gravity() * dt;     // כוח המשיכה מושך למטה קצת בכל רגע (🌍 בחלל — פחות)
    // 🛸 הסקייטבורד המעופף: מחזיקים את הקפיצה בזמן שיורדים — ומרחפים לאט, כמו מצנח
    robot.gliding = skin.board === "hover" && jumpHeld && robot.vy > HOVER_FALL;
    if (robot.gliding) robot.vy = HOVER_FALL;
    robot.y += robot.vy * dt;       // הרובוט זז לפי המהירות שלו
    if (robot.y >= GROUND_Y) {      // נגע ברצפה? נוחתים!
      robot.y = GROUND_Y;
      robot.vy = 0;
      robot.onGround = true;
      robot.gliding = false;
      missedFlip();
      if (state !== "playing") return;   // נחתנו על הראש בדרגה קשה — המשחק נגמר
      if (jumpBuffer > 0) doJump();
    }
  }
  if (jumpBuffer > 0) jumpBuffer -= dt;
  robot.wheelAngle += speed * dt / 6;
  if (skin.trail !== "none") emitTrail();    // ✨ השובל מאחורי הסקייטבורד

  // 5. מכשולים חדשים
  nextObstacleIn -= speed * dt;
  if (nextObstacleIn <= 0) spawnObstacle();

  // 🎁 יש פרס שמחכה? המכשול הכי קרוב שלפני הרובוט (ושכבר רואים על המסך) נעלם בפוף!
  if (prizesWaiting > 0) {
    let nearest = null;
    for (const o of obstacles) {
      const ahead = !o.passed && o.x + o.w > robot.x - 22;
      const onScreen = o.x < W - 20;
      if (ahead && onScreen && (!nearest || o.x < nearest.x)) nearest = o;
    }
    if (nearest) {
      poof(nearest);
      prizesWaiting--;
    }
  }

  // 6. המכשולים זזים, ובודקים: עברנו? נתקענו? (ורמפה — עולים עליה!)
  for (const o of obstacles) {
    o.x -= speed * dt;
    if (o.type === "ramp") {                 // רמפה לא מסוכנת — נוסעים עליה
      rideRamp(o);
      if (state !== "playing") return;       // (חוץ מנחיתה באמצע סלטה בדרגה קשה)
      continue;
    }
    // 🛸 הרחפן הראשון במשחק — מסבירים מה עושים
    if (o.type === "drone" && !droneHintShown && o.x < W - 40) {
      droneHintShown = true;
      addPopup("⚠ רחפן! לא קופצים — עוברים מתחת!", "rtl", "#c62828", 0, W / 2, 60, 0.008);
    }
    if (!o.passed && o.x + o.w < robot.x - 22) {
      o.passed = true;
      const got = addScore(1);
      speed = Math.min(level.MAX_SPEED, speed + level.SPEED_UP);
      addPopup("+" + got, "ltr", "#e65100", 0);
      updateScoreboard();
    }
    if (hitsRobot(o)) {
      // 👻 רובוט רפאים — עובר דרך המכשול (ואומר "ווּש" פעם אחת)
      if (ghostActive() && !o.ghosted) {
        o.ghosted = true;
        addPopup("👻", "ltr", "#90caf9", 0);
      }
      // 💔 נפגענו: קודם המגן, אחר כך נשמה. נגמרו הנשמות — המשחק נגמר
      if (takeHit(o, o.type === "drone" ? "drone" : "")) return;
      continue;
    }
  }
  obstacles = obstacles.filter(o => o.x + o.w > -20);   // מכשול שיצא מהמסך — נמחק

  // 7. המטבעות זזים עם הרחוב, ובודקים אם הרובוט נגע באחד מהם
  for (const c of coins) {
    c.x -= speed * dt;
    // 🧲 המגנט: מטבעות קרובים עפים אל הרובוט
    if (magnetTime > 0 && !c.taken) {
      const dx = robot.x - c.x, dy = (robot.y - 45) - c.y;
      const dist = Math.hypot(dx, dy);
      if (dist < MAGNET_RANGE && dist > 1) {
        const pull = Math.min(dist, (6 + (MAGNET_RANGE - dist) * 0.06) * dt);
        c.x += dx / dist * pull;
        c.y += dy / dist * pull;
      }
    }
    if (!c.taken && touchesCoin(c)) {
      c.taken = true;
      coinsCollected++;
      const got = addScore(COIN_VALUE);
      soundCoin();          // דינג-דינג! 🪙
      addPopup("+" + got, "ltr", "#ff8f00", 0, c.x, c.y - 18);
      // 🎁 אספנו מספיק מטבעות? מגיע פרס!
      if (coinsCollected % prizeEvery() === 0) {
        prizesWaiting++;
        addPopup("🎁 פרס!", "rtl", "#7b1fa2", 30);
      }
      updateScoreboard();
    }
  }
  coins = coins.filter(c => !c.taken && c.x > -20);    // מטבע שנאסף או שיצא מהמסך — נמחק

  // ⚡ בועות כוח-העל זזות עם הרחוב. נגענו באחת? מקבלים את הכוח!
  for (const p of powerups) {
    p.x -= speed * dt;
    if (!p.taken && touchesPower(p)) {
      p.taken = true;
      activatePower(p);
    }
  }
  powerups = powerups.filter(p => !p.taken && p.x > -30);

  // 8. ה-"+1" וה"סלטה!" עולים למעלה ונעלמים
  for (const p of popups) { p.y -= 1.2 * dt; p.life -= p.fade * dt; }
  popups = popups.filter(p => p.life > 0);

  // 9. הנצנצים של הפוף עפים לכל הכיוונים, נופלים קצת ונעלמים
  for (const s of sparkles) {
    s.x += (s.vx - speed * 0.5) * dt;
    s.y += s.vy * dt;
    s.vy += 0.08 * dt;
    s.life -= s.fade * dt;
  }
  sparkles = sparkles.filter(s => s.life > 0);
}

// נחת באמצע הסלטה? בדרגות קל ובינוני — לא נורא, רק בלי בונוס.
// בדרגה קשה — נתקעים! 😱 (FLIP_CRASH בטבלת הדרגות)
function missedFlip() {
  if (!robot.flipping) return;
  if (level.FLIP_CRASH && !ghostActive() && hurtTime <= 0) {
    // 😱 בדרגה קשה: נחיתה על הראש = נפגעים (המגן או נשמה מצילים, אחרת המשחק נגמר)
    if (shieldOn || lives > 1) { robot.flipping = false; robot.flipAngle = 0; }
    takeHit(null, "flip");
    return;
  }
  robot.flipping = false;
  robot.flipAngle = 0;
  addPopup("כמעט!", "rtl", "#546e7a", 0);
}

// 💔 הרובוט נפגע (o = המכשול שפגענו בו, או null בנחיתה על הראש).
// מחזיר true אם המשחק נגמר
function takeHit(o, reason) {
  if (ghostActive() || hurtTime > 0) return false;   // 👻 רפאים, או שעוד מהבהבים — לא נפגעים
  if (shieldOn) { shieldSaves(o); return false; }    // 🛡️ המגן נשבר במקום הנשמה
  lives--;
  if (lives <= 0) { crash(reason); return true; }    // נגמרו הנשמות — המשחק נגמר
  // איבדנו נשמה — אבל ממשיכים לנסוע!
  hurtTime = HURT_SECONDS * 60;
  if (o) {
    obstacles = obstacles.filter(other => other !== o);   // המכשול נשבר
    const box = obstacleBox(o);
    burst(o.x + o.w / 2, (box.top + box.bottom) / 2, "#ff7043", 18);
  }
  robot.flipping = false;
  robot.flipAngle = 0;
  addPopup("💔 נשארו " + lives, "rtl", "#e53935", 30);
  canvas.classList.remove("shake");
  void canvas.offsetWidth;
  canvas.classList.add("shake");
  soundHurt();
  updateScoreboard();
  return false;
}

// ------------------------------------------------------------
//  ⚡ כוחות-על, נקודות ושיאים
// ------------------------------------------------------------

// מוסיפים נקודות. כשהכפול ✖️2 פועל — כל נקודה שווה פי שניים!
function addScore(points) {
  const gained = points * (doubleTime > 0 ? 2 : 1);
  score += gained;
  checkRecord();
  return gained;
}

// 🏆 עברנו את השיא באמצע המשחק? חוגגים מיד — לא מחכים לסוף!
function checkRecord() {
  if (recordCelebrated || best <= 0 || score <= best) return;
  recordCelebrated = true;
  addPopup("🏆 שיא חדש!", "rtl", "#ff6d00", 0, W / 2, 80, 0.008);
  const colors = ["#ffd600", "#ff4081", "#00e5ff", "#76ff03", "#ff9100", "#e040fb"];
  for (let i = 0; i < 50; i++) {                      // קונפטי צבעוני שנופל מלמעלה
    sparkles.push({ x: rand(0, W), y: rand(-30, 30), vx: rand(-1.5, 1.5), vy: rand(0, 2),
                    size: rand(2.5, 5), color: colors[i % colors.length], life: 1, fade: 0.01 });
  }
  soundRecord();
}

// האם הרובוט נוגע בבועת כוח? (כמו מטבע, רק שהבועה גדולה יותר)
function touchesPower(p) {
  const r = 18;
  return robot.x - 24 < p.x + r && robot.x + 24 > p.x - r &&
         robot.y - 95 < p.y + r && robot.y > p.y - r;
}

function activatePower(p) {
  if (p.kind === "magnet") magnetTime = POWER_SECONDS * 60;   // 60 רגעים בכל שנייה
  if (p.kind === "double") doubleTime = POWER_SECONDS * 60;
  if (p.kind === "shield") shieldOn = true;
  burst(p.x, p.y, POWERS[p.kind].color, 16);
  addPopup(POWERS[p.kind].name, "rtl", POWERS[p.kind].color, 30);
  soundPower();
}

// 🛡️ המגן נשבר במקום הרובוט! (o = המכשול שפגענו בו — הוא נעלם. null = נחיתה על הראש)
function shieldSaves(o) {
  shieldOn = false;
  if (o) obstacles = obstacles.filter(other => other !== o);
  burst(robot.x, robot.y - 50, "#64b5f6", 24);
  addPopup("המגן הציל אותך!", "rtl", "#1565c0", 30);
  soundShield();
}

// ✨ השובל: בכל רגע שני יוצא נצנץ קטן מהזנב של הסקייטבורד, והרחוב "לוקח" אותו אחורה
function emitTrail() {
  trailTick++;
  if (trailTick % 2) return;
  let color;
  const it = findItem("trail", skin.trail);
  if (it && it.colors) {                        // 💎 שובל יוקרה: הצבעים כתובים בחנות
    color = it.colors[Math.floor(Math.random() * it.colors.length)];
  } else if (skin.trail === "rainbow") {               // 🌈 קשת: הצבעים באים אחד אחרי השני
    const rainbow = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa"];
    color = rainbow[Math.floor(trailTick / 2) % rainbow.length];
  } else {                                      // ✨ נצנצים: זהב וצהוב
    const gold = ["#fff59d", "#ffd600", "#ffe082", "#fffde7"];
    color = gold[Math.floor(Math.random() * gold.length)];
  }
  sparkles.push({ x: robot.x - 34, y: robot.y - 14 + rand(-3, 3), vx: -rand(0.5, 1.5), vy: rand(-0.6, 0.2),
                  size: rand(2, 3.5), color: color, life: 1, fade: 0.045 });
}

// פיצוץ קטן של נצנצים בצבע אחד
function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(1.5, 4.5);
    sparkles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
                    size: rand(2, 4), color: color, life: 1, fade: 0.03 });
  }
}

// בועת כוח חדשה באמצע רווח גדול — בגובה שמגיעים אליו רק בקפיצה
function spawnPowerUp(x) {
  const kinds = Object.keys(POWERS);
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  powerups.push({ kind: kind, x: x, y: GROUND_Y - 135, taken: false, phase: rand(0, 6.28) });
}

// ------------------------------------------------------------
//  🛹 רמפות
// ------------------------------------------------------------

// כמה גבוה המשטח של הרמפה בנקודה px (מינוס 1 = הנקודה בכלל לא על הרמפה)
function rampHeightAt(o, px) {
  if (px < o.x || px > o.x + o.w) return -1;
  return o.h * (px - o.x) / o.w;   // ככל שמתקדמים על הרמפה — עולים גבוה יותר
}

function rideRamp(o) {
  if (robot.crashed) return;

  if (robot.onRamp === o) {
    if (robot.x > o.x + o.w) {
      // 🚀 הגענו לקצה הרמפה — עפים!
      robot.onRamp = null;
      robot.onGround = false;
      robot.y = GROUND_Y - o.h;
      robot.vy = -RAMP_POWER;
      ramps++;
      addPopup("וואו!", "rtl", "#0277bd", 30);
      soundRamp();
    } else {
      robot.y = GROUND_Y - rampHeightAt(o, robot.x);   // נוסעים במעלה הרמפה
    }
    return;
  }

  // עוד לא על הרמפה: עולים עליה מהרצפה, או נוחתים עליה מהאוויר
  const h = rampHeightAt(o, robot.x);
  if (h < 0) return;
  const landing = !robot.onGround && robot.vy >= 0 && robot.y >= GROUND_Y - h;
  if (robot.onGround || landing) {
    if (landing) {
      missedFlip();
      if (state !== "playing") return;
    }
    robot.onRamp = o;
    robot.onGround = true;
    robot.vy = 0;
    robot.y = GROUND_Y - h;
    if (landing && jumpBuffer > 0) doJump();
  }
}

// כמה זמן הרובוט באוויר כשהרמפה מעיפה אותו
function rampFlightTime() {
  const g = gravity();
  return (RAMP_POWER + Math.sqrt(RAMP_POWER * RAMP_POWER + 2 * g * RAMP_H)) / g;
}

function spawnRamp() {
  const ramp = { type: "ramp", w: RAMP_W, h: RAMP_H, x: W + 10, passed: true };
  obstacles.push(ramp);
  // אחרי הרמפה — מספיק מקום לעוף, לנחות ולהתכונן למכשול הבא
  const gap = rampFlightTime() + rand(35, 55);
  nextObstacleIn = speed * gap + ramp.w;

  // 🪙 קשת מטבעות סודית בדיוק בגובה של המעוף — אפשר להגיע אליה רק מהרמפה!
  const g = gravity();
  const topTime = RAMP_POWER / g;           // מתי הרובוט מגיע הכי גבוה
  for (let i = 0; i < COINS_IN_A_ROW; i++) {
    const fromMiddle = i - (COINS_IN_A_ROW - 1) / 2;
    const t = topTime + fromMiddle * 8;
    const height = RAMP_H + RAMP_POWER * t - g * t * (t + 1) / 2;
    coins.push({
      x: ramp.x + ramp.w + speed * t,
      y: Math.max(14, GROUND_Y - height - 30),
      spin: i * 0.6,
      taken: false
    });
  }
}

// 💨 פוף! המכשול נעלם, ובמקומו ענן עשן קטן ונצנצים צבעוניים
function poof(o) {
  obstacles = obstacles.filter(other => other !== o);
  poofs++;
  const box = obstacleBox(o);
  const cx = o.x + o.w / 2, cy = (box.top + box.bottom) / 2;
  // ענן עשן לבן: עיגולים גדולים שזזים לאט
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2;
    sparkles.push({ x: cx, y: cy, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2 - 0.6,
                    size: rand(9, 14), color: "#ffffff", life: 1, fade: 0.035 });
  }
  // נצנצים צבעוניים: נקודות קטנות שעפות מהר
  const colors = ["#ffd600", "#e040fb", "#00e5ff", "#76ff03"];
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(2, 5);
    sparkles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5,
                    size: rand(2, 4), color: colors[i % colors.length], life: 1, fade: 0.025 });
  }
  addPopup("פוף!", "rtl", "#7b1fa2", 0, cx, box.top - 18);
  soundPoof();
}

// איפה המכשול למעלה ולמטה (רחפן עף באוויר, כל השאר עומדים על המדרכה)
function obstacleBox(o) {
  if (o.type === "drone") return { top: DRONE_TOP, bottom: DRONE_BOTTOM };
  return { top: GROUND_Y - o.h, bottom: GROUND_Y };
}

// כיתוב קטן שעף למעלה מעל הרובוט.
// dir = כיוון הכתיבה: "rtl" לעברית, "ltr" למספרים (כדי ש-+1 לא ייראה כמו 1+)
// אם לא אומרים איפה (x, y) — הכיתוב מופיע מעל הראש של הרובוט
// fade = כמה מהר הכיתוב נעלם (מספר קטן = נשאר יותר זמן על המסך)
function addPopup(text, dir, color, raise, x, y, fade) {
  if (x === undefined) x = robot.x;
  if (y === undefined) y = robot.y - 115;
  popups.push({ text: text, dir: dir, color: color, x: x, y: y - raise, life: 1, fade: fade || 0.025 });
}

// מזיזים שורת בניינים. בניין שיצא משמאל — חוזר מימין כבניין חדש
function moveLayer(list, factor, maker, gapMin, gapMax, dt) {
  let rightEdge = 0;
  for (const b of list) rightEdge = Math.max(rightEdge, b.x + b.w);
  for (const b of list) {
    b.x -= speed * factor * dt;
    if (b.x + b.w < -DEPTH) {
      Object.assign(b, maker(rightEdge + rand(gapMin, gapMax)));
      rightEdge = b.x + b.w;
    }
  }
}

function spawnObstacle() {
  if (Math.random() < level.RAMP_CHANCE) { spawnRamp(); return; }   // 🛹 הפעם — רמפה!
  let type;
  if (Math.random() < level.DRONE_CHANCE) {
    type = { name: "drone", w: DRONE_W, h: 0 };                        // 🛸 הפעם — רחפן!
  } else {
    type = pick(world().OBSTACLES || OBSTACLE_TYPES);                 // 🌍 המכשולים של העולם שאנחנו בו
  }
  obstacles.push({ type: type.name, icon: type.icon, hop: type.hop,
                   w: type.w, h: type.h, x: W + 10, passed: false, bob: rand(0, 6.28) });
  // כמה זמן הרובוט באוויר בקפיצה אחת — כדי שתמיד יהיה מספיק זמן לנחות ולקפוץ שוב
  const airTime = 2 * JUMP_POWER / gravity();
  const minGap = Math.max(level.GAP_MIN, airTime + 10);
  const maxGap = Math.max(level.GAP_MAX, minGap + 20);
  const gap = rand(minGap, maxGap);
  nextObstacleIn = speed * gap + type.w;

  // 🪙 קשת מטבעות (או ⚡ בועת כוח) באמצע הרווח — רק אם הרווח גדול מספיק כדי לנחות,
  // לקפוץ אליהם ולנחות שוב לפני המכשול הבא
  if (gap < airTime * 2 + 10) return;
  const middle = W + 10 + type.w + speed * gap / 2;
  if (Math.random() < level.POWER_CHANCE) {
    spawnPowerUp(middle);
  } else if (Math.random() < COIN_CHANCE) {
    for (let i = 0; i < COINS_IN_A_ROW; i++) {
      const fromMiddle = i - (COINS_IN_A_ROW - 1) / 2;       // ‎-1, 0, 1 (שמאל, אמצע, ימין)
      coins.push({
        x: middle + fromMiddle * 45,
        y: GROUND_Y - 150 + Math.abs(fromMiddle) * 30,       // האמצעי הכי גבוה, ככה יוצאת קשת
        spin: i * 0.6,                                       // כל מטבע מסתובב קצת אחרת
        taken: false
      });
    }
  }
}

// האם הרובוט נוגע במטבע? בודקים אם הקופסה הבלתי נראית של הרובוט נוגעת בקופסה של המטבע
function touchesCoin(c) {
  const r = 11;   // הרדיוס (חצי הרוחב) של המטבע
  return robot.x - 24 < c.x + r && robot.x + 24 > c.x - r &&
         robot.y - 95 < c.y + r && robot.y > c.y - r;
}

// האם המכשול נוגע ברובוט? (משאירים קצת מקום, כדי שנגיעה של פיקסל אחד לא תיחשב)
function hitsRobot(o) {
  const rLeft = robot.x - 22, rRight = robot.x + 22;
  const rTop = robot.y - 88, rBottom = robot.y - 2;
  const box = obstacleBox(o);
  const oLeft = o.x + 4, oRight = o.x + o.w - 4;
  const oTop = box.top + 4;
  const oBottom = o.type === "drone" ? box.bottom - 3 : box.bottom;
  return rLeft < oRight && rRight > oLeft && rTop < oBottom && rBottom > oTop;
}

// ------------------------------------------------------------
//  🎨 הציור: מציירים את כל המסך מחדש בכל רגע
// ------------------------------------------------------------
// 🌙 כמה לילה עכשיו: 0 = יום מלא, 1 = לילה מלא (לפי השעון של העיר)
function nightAmount() {
  const t = dayClock;
  if (t < 0.4) return 0;
  if (t < 0.5) return (t - 0.4) / 0.1;      // שקיעה — מחשיך לאט
  if (t < 0.88) return 1;
  return 1 - (t - 0.88) / 0.12;             // זריחה — מאיר לאט
}
// כמה "שקיעה" עכשיו (שמיים כתומים-סגולים): הכי חזק באמצע השקיעה ובאמצע הזריחה
function sunsetAmount() {
  const t = dayClock;
  if (t >= 0.38 && t <= 0.52) return 1 - Math.abs(t - 0.45) / 0.07;
  if (t >= 0.88) return 1 - Math.abs(t - 0.94) / 0.06;
  return 0;
}

// 🌙 בלילה ובשקיעה מציירים את העיר על דף נפרד, צובעים אותה בכהה (או בכתום), ורק אז מדביקים על המסך.
// ככה רק העיר מחשיכה — והשמיים, הכוכבים והירח נשארים יפים
let layerOn = false;
let nightNow = 0;               // כמה לילה בציור הנוכחי (בשביל הבניינים הרחוקים)
function beginLayer(night, sunset) {
  layerOn = night > 0.01 || sunset > 0.01;
  if (!layerOn) return;
  ctx = layerCtx;
  layerCtx.clearRect(0, 0, W, H);
}
function endLayer(night, sunset, lights) {
  if (!layerOn) return;
  // "source-atop" = צובעים רק מעל מה שכבר צויר בדף הזה
  layerCtx.globalCompositeOperation = "source-atop";
  if (sunset > 0) {
    layerCtx.fillStyle = "rgba(255, 120, 60, " + 0.18 * sunset + ")";
    layerCtx.fillRect(0, 0, W, H);
  }
  if (night > 0) {
    layerCtx.fillStyle = "rgba(8, 14, 45, " + NIGHT_DARKNESS * night + ")";
    layerCtx.fillRect(0, 0, W, H);
  }
  layerCtx.globalCompositeOperation = "source-over";
  if (lights) lights();         // האורות (חלונות דולקים) — אחרי ההחשכה, כדי שיאירו
  ctx = mainCtx;
  mainCtx.drawImage(layerCanvas, 0, 0);
}

function draw(now) {
  const night = nightAmount(), sunset = sunsetAmount();
  nightNow = night;

  // שמיים, כוכבים, שמש או ירח, ועננים
  drawSky(now, night, sunset);
  if (!world().SPACE) for (const c of clouds) drawCloud(c, night, sunset);   // 🚀 בחלל אין עננים
  drawDecor(false);                                                          // ✈️ קישוטים בשמיים

  // העיר — בלילה היא מחשיכה, והחלונות נדלקים
  // (את הבניינים הקרובים מציירים מימין לשמאל: ככה הבניין השמאלי מסתיר את קיר הצד של זה שמימינו)
  const sorted = buildings.slice().sort((a, b) => b.x - a.x);
  beginLayer(night, sunset);
  for (const b of farBuildings) drawFarBuilding(b);
  for (const b of sorted) drawBuilding(b);
  endLayer(night, sunset, function () {
    for (const b of sorted) drawWindowLights(b, night);
  });

  // הרחוב והמכשולים — גם הם מחשיכים בלילה
  beginLayer(night, sunset);
  drawRoad();
  drawDecor(true);                                  // ⛵ סירות ודולפינים בים (רק בחוף)
  for (const o of obstacles) drawObstacle(o, now);
  endLayer(night, sunset);

  // מכאן — דברים שמאירים, או שחשוב לראות טוב גם בלילה
  drawHeadlight(night);
  for (const c of coins) drawCoin(c, now);
  for (const p of powerups) drawPowerUp(p, now);
  drawRobot(now);
  drawShieldBubble(now);
  drawSnow();
  drawSparkles();
  drawPopups();
  drawPowerHud(now);
  drawLives(now);

  // הרובוט עף כל כך גבוה שהוא יצא מהמסך? חץ קטן למעלה מראה איפה הוא
  if (robot.y < 40) {
    ctx.fillStyle = "#ff6d00";
    ctx.beginPath();
    ctx.moveTo(robot.x, 4); ctx.lineTo(robot.x - 9, 18); ctx.lineTo(robot.x + 9, 18);
    ctx.closePath(); ctx.fill();
  }
}

function drawSparkles() {
  for (const s of sparkles) {
    ctx.globalAlpha = Math.max(0, s.life) * (s.color === "#ffffff" ? 0.8 : 1);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * (s.color === "#ffffff" ? 2 - s.life : 1), 0, Math.PI * 2);   // העשן גדל ומתפזר
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 🌙 השמיים: מערבבים את צבעי היום, השקיעה והלילה לפי השעון של העיר
function drawSky(now, night, sunset) {
  // 🌍 הצבעים של העולם שאנחנו בו (באמצע מעבר — מערבבים את הישן והחדש)
  let top = mixColor(worldColor("SKY_TOP"), hexToRgb(NIGHT_SKY_TOP_COLOR), night);
  let bottom = mixColor(worldColor("SKY_BOTTOM"), hexToRgb(NIGHT_SKY_BOTTOM_COLOR), night);
  top = mixColor(top, hexToRgb(SUNSET_SKY_TOP_COLOR), sunset * 0.85);
  bottom = mixColor(bottom, hexToRgb(SUNSET_SKY_BOTTOM_COLOR), sunset * 0.85);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, rgbText(top));
  g.addColorStop(1, rgbText(bottom));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y);
  // ✨ כוכבים שמנצנצים — רק כשמחשיך (🚀 ובחלל — כל הזמן)
  const space = world().SPACE ? worldFade : WORLDS[prevWorldIndex].SPACE ? 1 - worldFade : 0;
  const starLight = Math.max(night, space);
  if (starLight > 0.05) {
    for (const s of stars) {
      ctx.fillStyle = "rgba(255, 255, 255, " + starLight * (0.55 + 0.45 * Math.sin(now / 400 + s.phase)) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (space > 0.5) { drawPlanet(); return; }   // 🪐 בחלל אין שמש וירח — יש כוכב לכת
  drawSun(1 - night, sunset);
  if (night > 0.05) drawMoon(night);
}

// 🪐 כוכב לכת עם טבעת — במקום השמש, כשאנחנו בחלל
function drawPlanet() {
  const px = 690, py = 75;
  ctx.strokeStyle = "rgba(255, 224, 178, 0.8)";        // החצי האחורי של הטבעת
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(px, py, 52, 13, -0.3, Math.PI, Math.PI * 2); ctx.stroke();
  const g = ctx.createRadialGradient(px + 10, py - 10, 4, px, py, 32);
  g.addColorStop(0, "#ffcc80"); g.addColorStop(1, "#e65100");
  ctx.fillStyle = g;                                   // הכוכב עצמו
  ctx.beginPath(); ctx.arc(px, py, 30, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255, 224, 178, 0.95)";       // החצי הקדמי של הטבעת — מעל הכוכב
  ctx.beginPath(); ctx.ellipse(px, py, 52, 13, -0.3, 0, Math.PI); ctx.stroke();
}

// ❄️ פתיתי השלג — מתנדנדים קצת ימינה ושמאלה בזמן שהם נופלים
function drawSnow() {
  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  for (const f of flakes) {
    ctx.beginPath(); ctx.arc(f.x + Math.sin(f.sway) * 3, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
}

// השמש — בשקיעה היא נהיית כתומה. alpha = כמה רואים אותה (0 = בכלל לא)
function drawSun(alpha, sunset) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(255, 235, 59, 0.3)";
  ctx.beginPath(); ctx.arc(690, 70, 48, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sunset > 0 ? rgbText(mixColor(hexToRgb(SUN_COLOR), [255, 112, 67], sunset)) : SUN_COLOR;
  ctx.beginPath(); ctx.arc(690, 70, 34, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

// 🌕 הירח — עם הילה רכה ומכתשים קטנים
function drawMoon(alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(255, 249, 196, 0.15)";
  ctx.beginPath(); ctx.arc(690, 70, 48, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff9c4";
  ctx.beginPath(); ctx.arc(690, 70, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(190, 180, 130, 0.45)";
  ctx.beginPath(); ctx.arc(680, 62, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(700, 80, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(696, 58, 3, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

// ענן עם "בטן" אפורה למטה — ככה הוא נראה תפוח ועגול
function cloudShape(c, dy) {
  ctx.beginPath();
  ctx.arc(c.x, c.y + dy, 18 * c.size, 0, Math.PI * 2);
  ctx.arc(c.x + 20 * c.size, c.y - 8 * c.size + dy, 22 * c.size, 0, Math.PI * 2);
  ctx.arc(c.x + 42 * c.size, c.y + dy, 17 * c.size, 0, Math.PI * 2);
  ctx.fill();
}
function drawCloud(c, night, sunset) {
  // ביום לבן, בשקיעה ורדרד, בלילה כחלחל-כהה
  const belly = mixColor(mixColor([176, 203, 222], [40, 50, 90], night), [200, 120, 140], sunset * 0.6);
  const body = mixColor(mixColor([255, 255, 255], [90, 100, 140], night), [255, 204, 188], sunset * 0.7);
  ctx.fillStyle = rgbText(belly, 0.9);   // הצל של הענן
  cloudShape(c, 5 * c.size);
  ctx.fillStyle = rgbText(body, 0.95);   // הענן עצמו
  cloudShape(c, 0);
}

// בניין רחוק: שטוח ומעורפל, כי הוא ממש רחוק
function drawFarBuilding(b) {
  const top = GROUND_Y - b.h;
  ctx.fillStyle = b.color;
  ctx.fillRect(b.x, top, b.w, b.h);
  ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
  for (let wy = top + 10; wy < GROUND_Y - 14; wy += 18) {
    for (let wx = b.x + 7; wx < b.x + b.w - 9; wx += 14) ctx.fillRect(wx, wy, 6, 8);
  }
  // 🌙 בלילה — גם בבניינים הרחוקים נדלקים כמה חלונות (הם רחוקים, אז הם נראים עמומים)
  if (nightNow > 0.05) {
    ctx.fillStyle = "rgba(255, 224, 130, " + nightNow + ")";
    let i = 0;
    for (let wy = top + 10; wy < GROUND_Y - 14; wy += 18) {
      for (let wx = b.x + 7; wx < b.x + b.w - 9; wx += 14) {
        i++;
        if ((i * 11 + b.seed * 3) % 7 < 2) ctx.fillRect(wx, wy, 6, 8);
      }
    }
  }
}

// 🌙 החלונות הדולקים של הבניינים הקרובים (מציירים אותם אחרי ההחשכה, כדי שיאירו)
function drawWindowLights(b, night) {
  if (night < 0.05) return;
  const top = GROUND_Y - b.h;
  let i = 0;
  for (let wy = top + 12; wy < GROUND_Y - 22; wy += 24) {
    for (let wx = b.x + 10; wx < b.x + b.w - 14; wx += 20) {
      i++;
      if ((i * 13 + b.seed * 7) % 5 >= 2) continue;     // רק בערך 2 מכל 5 חלונות דולקים
      ctx.fillStyle = "rgba(255, 213, 79, " + 0.25 * night + ")";   // זוהר רך מסביב לחלון
      ctx.fillRect(wx - 1, wy - 1, 12, 14);
      ctx.fillStyle = "rgba(255, 224, 130, " + night + ")";
      ctx.fillRect(wx + 2, wy + 2, 8, 10);
    }
  }
}

// 🔦 בלילה לרובוט נדלק פנס שמאיר את הדרך קדימה
function drawHeadlight(night) {
  if (night < 0.05 || robot.crashed || robot.flipping || state !== "playing") return;
  const ex = robot.x + 10, ey = robot.y - 80;    // מהעיניים של הרובוט
  const far = 300;
  const g = ctx.createLinearGradient(ex, 0, ex + far, 0);
  g.addColorStop(0, "rgba(255, 244, 200, " + 0.45 * night + ")");
  g.addColorStop(1, "rgba(255, 244, 200, 0)");
  ctx.save();
  ctx.globalCompositeOperation = "lighter";      // "lighter" = האור מוסיף בהירות למה שמתחתיו
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(ex, ey - 3); ctx.lineTo(ex + far, ey - 40);
  ctx.lineTo(ex + far, ey + 100); ctx.lineTo(ex, ey + 3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// 🧊 בניין קרוב בתלת-ממד: קיר קדמי, קיר צד בצל, גג מואר וחלונות שקועים בקיר
function drawBuilding(b) {
  const top = GROUND_Y - b.h;
  const d = DEPTH, up = DEPTH * 0.6;   // כמה הצד האחורי של הבניין זז שמאלה ולמעלה

  // קיר הצד — בצל, כי השמש מימין
  ctx.fillStyle = shade(b.color, -0.32);
  ctx.beginPath();
  ctx.moveTo(b.x, top); ctx.lineTo(b.x - d, top - up);
  ctx.lineTo(b.x - d, GROUND_Y - up); ctx.lineTo(b.x, GROUND_Y);
  ctx.closePath(); ctx.fill();

  // הגג — מואר מלמעלה
  ctx.fillStyle = shade(b.color, 0.3);
  ctx.beginPath();
  ctx.moveTo(b.x, top); ctx.lineTo(b.x + b.w, top);
  ctx.lineTo(b.x + b.w - d, top - up); ctx.lineTo(b.x - d, top - up);
  ctx.closePath(); ctx.fill();

  // ❄️ שלג על הגג — שכבה לבנה ועבה שגולשת קצת מעבר לקצה
  if (b.snow) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(b.x - 2, top + 4); ctx.lineTo(b.x + b.w + 2, top + 4);
    ctx.lineTo(b.x + b.w - d, top - up - 3); ctx.lineTo(b.x - d - 2, top - up - 3);
    ctx.closePath(); ctx.fill();
  }
  // דוד שמש על הגג ☀️ (כמו על הגגות בישראל)
  if (b.solar && d > 0 && !b.snow) {
    const sx = b.x + b.w * 0.45, sy = top - up * 0.5;
    ctx.fillStyle = "#1a237e";                       // הקולט — לוח כחול כהה
    ctx.beginPath();
    ctx.moveTo(sx - 16, sy + 2); ctx.lineTo(sx - 2, sy + 2);
    ctx.lineTo(sx - 6, sy - 9); ctx.lineTo(sx - 20, sy - 9);
    ctx.closePath(); ctx.fill();
    const boiler = ctx.createLinearGradient(0, sy - 12, 0, sy);
    boiler.addColorStop(0, "#ffffff"); boiler.addColorStop(1, "#b0bec5");
    ctx.fillStyle = boiler;                          // הדוד — גליל לבן
    roundRect(sx, sy - 12, 18, 9, 4.5);
    ctx.fill();
  }

  // הקיר הקדמי — קצת יותר בהיר בצד ימין, איפה שהשמש
  const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
  g.addColorStop(0, shade(b.color, -0.08));
  g.addColorStop(1, shade(b.color, 0.14));
  ctx.fillStyle = g;
  ctx.fillRect(b.x, top, b.w, b.h);

  // חלונות: צל קטן למעלה ומשמאל, ככה הם נראים שקועים בתוך הקיר
  let i = 0;
  for (let wy = top + 12; wy < GROUND_Y - 22; wy += 24) {
    for (let wx = b.x + 10; wx < b.x + b.w - 14; wx += 20) {
      i++;
      ctx.fillStyle = shade(b.color, -0.4);
      ctx.fillRect(wx, wy, 10, 12);
      const shiny = (i * 7 + b.seed) % 6 === 0;      // חלק מהחלונות מחזירים את השמש
      ctx.fillStyle = shiny ? "#fffde7" : "#d6ecfa";
      ctx.fillRect(wx + 2, wy + 2, 8, 10);
    }
  }
}

function drawRoad() {
  const top = GROUND_Y - 6;   // החלק העליון של המדרכה (רואים אותו קצת מלמעלה)
  // 🌍 המדרכה והכביש בצבעים של העולם: בחוף — חול וים, בשלג — לבן, בחלל — אבק ירח
  const SIDEWALK_COLOR = rgbToHex(worldColor("GROUND"));
  const ROAD_COLOR = rgbToHex(worldColor("ROAD"));

  // המדרכה — כהה יותר בצד הרחוק, בהירה יותר בצד הקרוב
  const g = ctx.createLinearGradient(0, top, 0, GROUND_Y + 14);
  g.addColorStop(0, shade(SIDEWALK_COLOR, -0.12));
  g.addColorStop(1, shade(SIDEWALK_COLOR, 0.2));
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, 20);
  // קווים אלכסוניים בין המרצפות — זזים יחד עם הרחוב
  ctx.strokeStyle = "rgba(0, 0, 0, 0.13)";
  ctx.lineWidth = 2;
  for (let x = -(roadOffset % 40); x < W + 10; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x - 7, GROUND_Y + 14); ctx.stroke();
  }
  // שפת המדרכה — הקיר הקטן שיורד אל הכביש
  ctx.fillStyle = shade(SIDEWALK_COLOR, -0.3);
  ctx.fillRect(0, GROUND_Y + 14, W, 8);

  // הכביש — עם צל של המדרכה בחלק העליון
  const rg = ctx.createLinearGradient(0, GROUND_Y + 22, 0, H);
  rg.addColorStop(0, shade(ROAD_COLOR, -0.35));
  rg.addColorStop(0.15, ROAD_COLOR);
  rg.addColorStop(1, shade(ROAD_COLOR, 0.12));
  ctx.fillStyle = rg;
  ctx.fillRect(0, GROUND_Y + 22, W, H - GROUND_Y - 22);
  // הפסים הלבנים באמצע הכביש
  ctx.fillStyle = "#eceff1";
  for (let x = -(roadOffset % 70); x < W; x += 70) {
    ctx.fillRect(x, GROUND_Y + 45, 36, 5);
  }
}

// 🧊 צבע של גליל (כמו פח או צינור): כהה בצד שמאל, מבריק קצת לפני הצד הימני
function cylinder(left, right, color) {
  const g = ctx.createLinearGradient(left, 0, right, 0);
  g.addColorStop(0, shade(color, -0.4));
  g.addColorStop(0.7, shade(color, 0.3));
  g.addColorStop(1, shade(color, -0.05));
  return g;
}

// 🛹 רמפת עץ בתלת-ממד: משטח משופע מואר, צד משולש בצל ופס מתכת בקצה
function drawRamp(o) {
  const x = o.x, G = GROUND_Y, d = DEPTH, up = DEPTH * 0.6;
  drawShadow(x + o.w * 0.6, o.w * 1.1, 0.2);

  // המשטח המשופע — מואר, כי הוא פונה לשמיים
  ctx.fillStyle = shade(RAMP_COLOR, 0.18);
  ctx.beginPath();
  ctx.moveTo(x, G); ctx.lineTo(x + o.w, G - o.h);
  ctx.lineTo(x + o.w - d, G - o.h - up); ctx.lineTo(x - d, G - up);
  ctx.closePath(); ctx.fill();
  // הקווים בין הלוחות של העץ
  ctx.strokeStyle = "rgba(0, 0, 0, 0.15)";
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    const px = x + o.w * i / 4, py = G - o.h * i / 4;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - d, py - up); ctx.stroke();
  }

  // הצד המשולש — בצל
  const side = ctx.createLinearGradient(x, 0, x + o.w, 0);
  side.addColorStop(0, shade(RAMP_COLOR, -0.3));
  side.addColorStop(1, shade(RAMP_COLOR, -0.1));
  ctx.fillStyle = side;
  ctx.beginPath();
  ctx.moveTo(x, G); ctx.lineTo(x + o.w, G); ctx.lineTo(x + o.w, G - o.h);
  ctx.closePath(); ctx.fill();
  // קורות עץ שמחזיקות את הרמפה
  ctx.strokeStyle = shade(RAMP_COLOR, -0.45);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + o.w * 0.5, G); ctx.lineTo(x + o.w * 0.5, G - o.h * 0.5);
  ctx.moveTo(x + o.w * 0.5, G); ctx.lineTo(x + o.w - 2, G - o.h + 3);
  ctx.stroke();

  // פס מתכת בקצה העליון — משם עפים!
  ctx.strokeStyle = "#cfd8dc";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + o.w, G - o.h); ctx.lineTo(x + o.w - d, G - o.h - up); ctx.stroke();
}

// 🛸 רחפן: גוף מתכת עם פס צהוב של "זהירות", מדחפים שמסתובבים ואורות מהבהבים
function drawDrone(o, now) {
  const x = o.x, w = o.w, cx = x + w / 2;
  const bob = Math.sin(now / 220 + (o.bob || 0)) * 2.5;     // מרחף קצת למעלה ולמטה
  const top = DRONE_TOP + bob;
  drawShadow(cx, 30, 0.12);                                 // צל קטן על המדרכה — רואים איפה הוא
  // הזרוע שמחזיקה את המדחפים
  ctx.fillStyle = "#37474f";
  ctx.fillRect(x + 2, top + 5, w - 4, 3);
  // מנועים ומדחפים שמסתובבים מהר (רואים אותם כמו כתם מטושטש)
  for (const px of [x + 5, x + w - 5]) {
    ctx.fillStyle = "#263238";
    ctx.fillRect(px - 2, top, 4, 7);
    const spin = Math.abs(Math.sin(now / 25 + px)) * 11 + 2;
    ctx.fillStyle = "rgba(207, 216, 220, 0.85)";
    ctx.beginPath(); ctx.ellipse(px, top - 1, spin, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  }
  // הגוף
  ctx.fillStyle = cylinder(x + 9, x + w - 9, "#455a64");
  roundRect(x + 9, top + 4, w - 18, 15, 5);
  ctx.fill();
  ctx.fillStyle = "#ffd600";                                // פס צהוב של זהירות
  ctx.fillRect(x + 12, top + 11, w - 24, 3);
  // מצלמה מתחת לגוף, עם נורה אדומה
  ctx.fillStyle = "#102027";
  ctx.beginPath(); ctx.arc(cx, top + 18, 4.5, 0, Math.PI); ctx.fill();
  // רגליים
  ctx.strokeStyle = "#37474f";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 14, top + 18); ctx.lineTo(x + 11, top + 24);
  ctx.moveTo(x + w - 14, top + 18); ctx.lineTo(x + w - 11, top + 24);
  ctx.stroke();
  // אורות מהבהבים: אדום משמאל, ירוק מימין (כמו במטוס)
  const blink = Math.floor(now / 300) % 2 === 0;
  ctx.fillStyle = blink ? "#ff1744" : "#7f0000";
  ctx.beginPath(); ctx.arc(x + 12, top + 8, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = blink ? "#00e676" : "#1b5e20";
  ctx.beginPath(); ctx.arc(x + w - 12, top + 8, 2.2, 0, Math.PI * 2); ctx.fill();
}

// ⚡ בועת כוח-על שמרחפת באוויר ומהבהבת
function drawPowerUp(p, now) {
  const y = p.y + Math.sin(now / 250 + p.phase) * 4;       // הבועה מרחפת למעלה ולמטה
  const pulse = 0.5 + 0.5 * Math.sin(now / 150 + p.phase);
  drawShadow(p.x, 18, 0.1);
  ctx.fillStyle = rgbText(hexToRgb(POWERS[p.kind].color), 0.18 + 0.14 * pulse);   // הילה זוהרת
  ctx.beginPath(); ctx.arc(p.x, y, 27, 0, Math.PI * 2); ctx.fill();
  drawPowerIcon(p.kind, p.x, y, 18);
}

// הסמל של כל כוח: 🧲 מגנט (פרסה), 🛡️ מגן, ✖️2 כפול
function drawPowerIcon(kind, cx, cy, r) {
  const color = POWERS[kind].color;
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, shade(color, 0.6));
  g.addColorStop(1, color);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.stroke();
  ctx.save();
  if (kind === "magnet") {
    ctx.strokeStyle = "white";
    ctx.lineWidth = r * 0.28;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.38, cy - r * 0.42);
    ctx.lineTo(cx - r * 0.38, cy + r * 0.05);
    ctx.arc(cx, cy + r * 0.05, r * 0.38, Math.PI, 0, true);   // הקשת של הפרסה, מלמטה
    ctx.lineTo(cx + r * 0.38, cy - r * 0.42);
    ctx.stroke();
    ctx.fillStyle = "#cfd8dc";                                  // הקצוות הכסופים
    ctx.fillRect(cx - r * 0.52, cy - r * 0.62, r * 0.28, r * 0.22);
    ctx.fillRect(cx + r * 0.24, cy - r * 0.62, r * 0.28, r * 0.22);
  } else if (kind === "shield") {
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.6);
    ctx.lineTo(cx + r * 0.5, cy - r * 0.38);
    ctx.lineTo(cx + r * 0.44, cy + r * 0.12);
    ctx.quadraticCurveTo(cx + r * 0.3, cy + r * 0.5, cx, cy + r * 0.62);
    ctx.quadraticCurveTo(cx - r * 0.3, cy + r * 0.5, cx - r * 0.44, cy + r * 0.12);
    ctx.lineTo(cx - r * 0.5, cy - r * 0.38);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = color;                                      // פס באמצע המגן
    ctx.fillRect(cx - r * 0.06, cy - r * 0.42, r * 0.12, r * 0.86);
  } else if (kind === "double") {
    ctx.fillStyle = "white";
    ctx.font = "bold " + Math.round(r * 0.95) + "px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.direction = "ltr";
    ctx.fillText("x2", cx, cy + r * 0.05);
  }
  ctx.restore();
}

// 🛡️ בועת המגן מסביב לרובוט
function drawShieldBubble(now) {
  if (!shieldOn || robot.crashed) return;
  const pulse = 0.5 + 0.5 * Math.sin(now / 180);
  const cx = robot.x, cy = robot.y - 52;
  ctx.fillStyle = "rgba(100, 181, 246, " + (0.12 + 0.06 * pulse) + ")";
  ctx.beginPath(); ctx.ellipse(cx, cy, 44, 62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(144, 202, 249, " + (0.6 + 0.3 * pulse) + ")";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";             // ברק קטן על הבועה
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy, 36, 54, 0, -2.4, -1.6); ctx.stroke();
}

// ❤️ הלבבות בראש המסך: לב מלא = נשמה שנשארה, לב ריק = נשמה שהלכה. לרובוט רפאים — 👻
function drawLives(now) {
  if (state === "start") return;
  if (ghostActive()) {
    ctx.font = "26px 'Segoe UI Emoji', 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.direction = "ltr";
    ctx.fillText("👻", W / 2, 36);
    ctx.direction = "inherit";
    return;
  }
  for (let i = 0; i < LIVES; i++) {
    const cx = W / 2 + (i - (LIVES - 1) / 2) * 30, cy = 24;
    const full = i < lives;
    // הלב האחרון שנשאר פועם כשנשארה רק נשמה אחת
    const s = full && lives === 1 ? 1 + 0.12 * Math.sin(now / 120) : 1;
    heartPath(cx, cy, 11 * s);
    ctx.fillStyle = full ? "#e53935" : "rgba(255, 255, 255, 0.35)";
    ctx.fill();
    ctx.strokeStyle = full ? "#ffcdd2" : "rgba(255, 255, 255, 0.8)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
// צורה של לב (r = כמה הוא גדול)
function heartPath(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.9);
  ctx.bezierCurveTo(cx - r * 1.4, cy, cx - r * 0.9, cy - r * 1.1, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx + r * 0.9, cy - r * 1.1, cx + r * 1.4, cy, cx, cy + r * 0.9);
  ctx.closePath();
}

// ⏱️ הלוח בפינה: אילו כוחות פועלים עכשיו, ופס הטיימר שמתקצר עד שהכוח נגמר
function drawPowerHud(now) {
  const items = [];
  if (magnetTime > 0) items.push({ kind: "magnet", left: magnetTime / (POWER_SECONDS * 60) });
  if (doubleTime > 0) items.push({ kind: "double", left: doubleTime / (POWER_SECONDS * 60) });
  if (shieldOn) items.push({ kind: "shield", left: -1 });       // למגן אין טיימר — הוא נשאר עד שנשבר
  let x = 12;
  for (const it of items) {
    const width = it.left >= 0 ? 92 : 40;
    // שתי השניות האחרונות — הלוח מהבהב, כדי שתדע שהכוח עומד להיגמר
    const ending = it.left >= 0 && it.left * POWER_SECONDS < 2;
    ctx.globalAlpha = ending && Math.floor(now / 150) % 2 === 0 ? 0.35 : 1;
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    roundRect(x, 10, width, 34, 10);
    ctx.fill();
    drawPowerIcon(it.kind, x + 20, 27, 13);
    if (it.left >= 0) {
      ctx.fillStyle = "#cfd8dc";
      roundRect(x + 38, 23, 46, 8, 4);
      ctx.fill();
      ctx.fillStyle = POWERS[it.kind].color;
      roundRect(x + 38, 23, Math.max(8, 46 * it.left), 8, 4);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    x += width + 8;
  }
}

function drawObstacle(o, now) {
  const x = o.x, base = GROUND_Y, top = GROUND_Y - o.h;

  if (o.type === "drone") {
    drawDrone(o, now);

  } else if (o.type === "icon") {
    // 🌍 מכשול מסמל: הסמל קצת יותר גדול מהקופסה שאסור לגעת בה — ככה זה הוגן
    drawShadow(x + o.w / 2, o.w * 1.3, 0.25);
    const hop = o.hop ? Math.abs(Math.sin(now / 180 + o.bob)) * 6 : 0;   // מכשולים חיים קופצים קצת
    ctx.font = Math.round(o.h * 1.15) + "px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.direction = "ltr";
    ctx.fillStyle = "#000";            // צבע מלא — אחרת הסמל יוצא שקוף כמו הצל
    ctx.fillText(o.icon, x + o.w / 2, base + o.h * 0.12 - hop);
    ctx.textBaseline = "alphabetic";
    ctx.direction = "inherit";

  } else if (o.type === "ramp") {
    drawRamp(o);

  } else if (o.type === "cone") {
    // קונוס: כתום עם פס לבן, ובסיס מרובע שרואים לו גם את החלק העליון
    drawShadow(x + o.w / 2, o.w * 1.4, 0.25);
    ctx.fillStyle = "#ffab40";                       // החלק העליון של הבסיס
    ctx.beginPath();
    ctx.moveTo(x - 3, base - 5); ctx.lineTo(x + o.w + 3, base - 5);
    ctx.lineTo(x + o.w, base - 8); ctx.lineTo(x, base - 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#bf360c";                       // החזית של הבסיס
    ctx.fillRect(x - 3, base - 5, o.w + 6, 5);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x + 3, base - 7);
    ctx.lineTo(x + o.w - 3, base - 7);
    ctx.lineTo(x + o.w / 2, top);
    ctx.closePath();
    ctx.fillStyle = cylinder(x + 3, x + o.w - 3, "#ff9100");
    ctx.fill();
    ctx.clip();                         // הפס הלבן נצבע רק בתוך הקונוס
    ctx.fillStyle = cylinder(x + 3, x + o.w - 3, "#f5f5f5");
    ctx.fillRect(x, top + o.h * 0.4, o.w, 7);
    ctx.restore();

  } else if (o.type === "trashcan") {
    // פח זבל: גליל ירוק עם פסים, ומכסה עגול
    drawShadow(x + o.w / 2, o.w * 1.4, 0.28);
    ctx.fillStyle = cylinder(x + 2, x + o.w - 2, "#43a047");
    ctx.fillRect(x + 2, top + 8, o.w - 4, o.h - 8);
    ctx.strokeStyle = "rgba(0, 0, 0, 0.2)";
    ctx.lineWidth = 2;
    for (let lx = x + 9; lx < x + o.w - 4; lx += 8) {
      ctx.beginPath(); ctx.moveTo(lx, top + 13); ctx.lineTo(lx, base - 4); ctx.stroke();
    }
    ctx.fillStyle = cylinder(x, x + o.w, "#2e7d32");          // השפה של המכסה
    ctx.fillRect(x, top + 3, o.w, 6);
    ctx.fillStyle = shade("#2e7d32", 0.3);                    // המכסה מלמעלה (עיגול שטוח)
    ctx.beginPath(); ctx.ellipse(x + o.w / 2, top + 3, o.w / 2, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1b5e20";                                // הידית
    ctx.fillRect(x + o.w / 2 - 5, top - 3, 10, 3);

  } else if (o.type === "hydrant") {
    // ברז כיבוי אש: גליל אדום, כיפה עגולה וזרועות בצדדים
    const red = "#d32f2f";
    drawShadow(x + o.w / 2, o.w * 1.5, 0.25);
    ctx.fillStyle = cylinder(x + 1, x + o.w - 1, red);
    ctx.fillRect(x + 1, base - 5, o.w - 2, 5);                // בסיס
    ctx.fillStyle = cylinder(x + 5, x + o.w - 5, red);
    ctx.fillRect(x + 5, top + 10, o.w - 10, o.h - 14);        // גוף
    ctx.fillStyle = cylinder(x, x + o.w, red);
    ctx.fillRect(x, top + 16, o.w, 7);                        // הזרועות
    ctx.fillStyle = "#8e0000";                                // הפקקים בקצוות
    ctx.beginPath(); ctx.arc(x + 1, top + 19.5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + o.w - 1, top + 19.5, 3, 0, Math.PI * 2); ctx.fill();
    const dome = ctx.createRadialGradient(x + o.w / 2 + 3, top + 5, 1, x + o.w / 2, top + 11, o.w / 2 - 5);
    dome.addColorStop(0, shade(red, 0.55));
    dome.addColorStop(1, shade(red, -0.25));
    ctx.fillStyle = dome;
    ctx.beginPath();
    ctx.arc(x + o.w / 2, top + 11, o.w / 2 - 5, Math.PI, 0);   // כיפה
    ctx.fill();
    ctx.fillStyle = "#b71c1c";
    ctx.fillRect(x + o.w / 2 - 2, top, 4, 4);                 // הבורג למעלה
  }
}

// מטבע זהב שמסתובב: כשהוא "מסתובב" הוא נהיה צר, ורואים את העובי שלו
function drawCoin(c, now) {
  const r = 11;
  drawShadow(c.x, 14, 0.12);                        // צל קטן על המדרכה — ככה רואים שהוא מרחף
  const turn = Math.abs(Math.cos(now / 220 + c.spin));
  const width = Math.max(2, turn * r);
  const edge = (1 - turn) * 3 + 1;                  // העובי של המטבע
  ctx.fillStyle = "#e65100";
  ctx.beginPath(); ctx.ellipse(c.x - edge, c.y, width, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff8f00";                        // השפה של המטבע
  ctx.beginPath(); ctx.ellipse(c.x, c.y, width, r, 0, 0, Math.PI * 2); ctx.fill();
  const face = ctx.createLinearGradient(c.x + width, c.y - r, c.x - width, c.y + r);
  face.addColorStop(0, shade(COIN_COLOR, 0.55));   // מואר מלמעלה מימין
  face.addColorStop(1, shade(COIN_COLOR, -0.15));
  ctx.fillStyle = face;                             // הפנים הזהובות
  ctx.beginPath(); ctx.ellipse(c.x, c.y, Math.max(1, width - 2.5), r - 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255, 255, 255, 0.75)";      // ברק קטן
  ctx.beginPath(); ctx.ellipse(c.x + width * 0.3, c.y - 4, Math.max(0.5, width * 0.2), 3, 0, 0, Math.PI * 2); ctx.fill();
}

// מלבן עם פינות מעוגלות
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 🛹 הצבעים של הסקייטבורד (לפי מה שקנינו בחנות)
function boardPaint(kind, x) {
  if (kind === "flames") {
    const g = ctx.createLinearGradient(x - 36, 0, x + 36, 0);
    g.addColorStop(0, "#b71c1c"); g.addColorStop(0.5, "#ff6d00"); g.addColorStop(1, "#ffea00");
    return { under: "#5d1000", main: g, shine: "rgba(255, 245, 157, 0.9)" };
  }
  if (kind === "rainbow") {
    const g = ctx.createLinearGradient(x - 36, 0, x + 36, 0);
    const colors = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa"];
    for (let i = 0; i < colors.length; i++) g.addColorStop(i / (colors.length - 1), colors[i]);
    return { under: "#311b92", main: g, shine: "rgba(255, 255, 255, 0.7)" };
  }
  if (kind === "hover") {
    const g = ctx.createLinearGradient(x - 36, 0, x + 36, 0);
    g.addColorStop(0, "#5e35b1"); g.addColorStop(1, "#00e5ff");
    return { under: "#1a0d3d", main: g, shine: "rgba(178, 255, 255, 0.95)" };
  }
  const it = findItem("board", kind);
  if (it && it.paint) {                         // 💎 סקייטבורד יוקרה: הצבעים כתובים בחנות
    const g = ctx.createLinearGradient(x - 36, 0, x + 36, 0);
    for (let i = 0; i < it.paint.length; i++) g.addColorStop(i / (it.paint.length - 1), it.paint[i]);
    return { under: it.under, main: g, shine: "rgba(255, 255, 255, 0.8)" };
  }
  return { under: shade(BOARD_COLOR, -0.4), main: BOARD_COLOR, shine: shade(BOARD_COLOR, 0.45) };
}

// 🎩 הכובע (לפי מה שקנינו בחנות). הראש של הרובוט: מ-x-16 עד x+16, והחלק העליון שלו ב-y-90.
// הכובעים לא עולים מעל y-107, כדי שעדיין יהיה רווח מתחת לרחפנים
function drawHat(kind, x, y) {
  if (kind === "cap") {
    ctx.fillStyle = "#1565c0";                                         // הכיפה
    ctx.beginPath(); ctx.arc(x, y - 89, 15, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0d47a1";                                         // המצחייה — קדימה
    roundRect(x + 6, y - 92, 20, 5, 2.5);
    ctx.fill();
    ctx.fillStyle = "white";                                           // הכפתור למעלה
    ctx.beginPath(); ctx.arc(x, y - 104, 2.2, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "cat") {
    for (const side of [-1, 1]) {                                      // 🐱 שתי אוזניים משולשות
      ctx.fillStyle = "#fb8c00";
      ctx.beginPath();
      ctx.moveTo(x + side * 15, y - 88); ctx.lineTo(x + side * 11, y - 101); ctx.lineTo(x + side * 4, y - 89);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f8bbd0";                                       // הצד הוורוד בפנים
      ctx.beginPath();
      ctx.moveTo(x + side * 13, y - 89); ctx.lineTo(x + side * 11, y - 97); ctx.lineTo(x + side * 7, y - 89);
      ctx.closePath(); ctx.fill();
    }
  } else if (kind === "pirate") {
    ctx.fillStyle = "#212121";                                         // כובע פיראט שחור
    ctx.beginPath();
    ctx.moveTo(x - 22, y - 89);
    ctx.quadraticCurveTo(x - 14, y - 95, x - 10, y - 106);
    ctx.quadraticCurveTo(x, y - 101, x + 10, y - 106);
    ctx.quadraticCurveTo(x + 14, y - 95, x + 22, y - 89);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#ffd600";                                       // פס זהב
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 20, y - 90); ctx.quadraticCurveTo(x, y - 94, x + 20, y - 90); ctx.stroke();
    ctx.fillStyle = "white";                                           // גולגולת קטנה ☠
    ctx.beginPath(); ctx.arc(x, y - 99, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 97); ctx.lineTo(x + 4, y - 94);
    ctx.moveTo(x + 4, y - 97); ctx.lineTo(x - 4, y - 94);
    ctx.stroke();
  } else if (kind === "crown") {
    const g = ctx.createLinearGradient(x - 15, 0, x + 15, 0);          // כתר זהב מבריק
    g.addColorStop(0, "#c79100"); g.addColorStop(0.6, "#fff176"); g.addColorStop(1, "#ffb300");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 15, y - 89);
    ctx.lineTo(x - 15, y - 102);
    ctx.lineTo(x - 8, y - 95);
    ctx.lineTo(x, y - 105);
    ctx.lineTo(x + 8, y - 95);
    ctx.lineTo(x + 15, y - 102);
    ctx.lineTo(x + 15, y - 89);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e53935";                                         // אבני חן
    ctx.beginPath(); ctx.arc(x, y - 93, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1e88e5";
    ctx.beginPath(); ctx.arc(x - 8, y - 92, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, y - 92, 1.8, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "party") {
    ctx.fillStyle = "#ec407a";                                         // 🎉 חרוט מסיבה ורוד
    ctx.beginPath(); ctx.moveTo(x - 11, y - 89); ctx.lineTo(x + 2, y - 104); ctx.lineTo(x + 11, y - 89);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffeb3b";                                         // נקודות צהובות
    for (const [dx, dy] of [[-4, -92], [4, -93], [0, -98]]) {
      ctx.beginPath(); ctx.arc(x + dx, y + dy, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#00e5ff";                                         // פונפון למעלה
    ctx.beginPath(); ctx.arc(x + 2, y - 105, 2.6, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "wizard") {
    ctx.fillStyle = "#3949ab";                                         // 🧙 כובע קוסם כחול, שהקצה שלו נוטה אחורה
    ctx.beginPath(); ctx.moveTo(x - 17, y - 89); ctx.quadraticCurveTo(x - 4, y - 99, x - 12, y - 107);
    ctx.quadraticCurveTo(x + 2, y - 100, x + 17, y - 89); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#283593";                                         // השוליים הרחבים
    roundRect(x - 20, y - 92, 40, 4, 2);
    ctx.fill();
    ctx.fillStyle = "#ffd600";                                         // כוכב וירח קטנים
    ctx.beginPath(); ctx.arc(x + 2, y - 96, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 6, y - 99, 1.3, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "unicorn") {
    const g = ctx.createLinearGradient(x, y - 107, x + 4, y - 90);     // 🦄 קרן בצבעי פנינה
    g.addColorStop(0, "#fff9c4"); g.addColorStop(0.5, "#f8bbd0"); g.addColorStop(1, "#b39ddb");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - 4, y - 89); ctx.lineTo(x + 3, y - 107); ctx.lineTo(x + 5, y - 89);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";                      // פסים מסובבים על הקרן
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 2, y - 94); ctx.lineTo(x + 4, y - 96);
    ctx.moveTo(x - 1, y - 99); ctx.lineTo(x + 4, y - 101);
    ctx.stroke();
  } else if (kind === "halo") {
    ctx.save();                                                        // 😇 הילה זהובה שזוהרת מעל הראש
    ctx.shadowColor = "rgba(255, 235, 59, 0.9)";
    ctx.shadowBlur = 8;
    ctx.strokeStyle = "#ffd600";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y - 101, 13, 4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawRobot(now) {
  const x = robot.x, y = robot.y;
  const look = currentLook();          // 🛒 מה הרובוט לובש (מהחנות)
  const BODY = look.body, DARK = look.dark;
  // 👻 רובוט רפאים: שקוף וזוהר. 💔 אחרי פגיעה: מהבהב
  let alpha = 1;
  if (!lookOverride && ghostActive()) alpha = GHOST_SEE_THROUGH;
  if (!lookOverride && hurtTime > 0 && Math.floor(now / 80) % 2 === 0) alpha = 0.25;

  // צל על המדרכה — קטן יותר כשהרובוט גבוה באוויר
  const height = GROUND_Y - y;
  const shadow = Math.max(0.3, 1 - height / 200);
  drawShadow(x, 72 * shadow, 0.25 * shadow);

  ctx.save();
  ctx.globalAlpha = alpha;
  const ghostGlow = ghostActive() && !lookOverride ? 14 : 0;   // הילה לבנה-כחלחלה של רוח רפאים
  const GHOST_GLOW_COLOR = "rgba(200, 230, 255, 0.9)";
  if (ghostGlow) {
    ctx.shadowColor = GHOST_GLOW_COLOR;
    ctx.shadowBlur = ghostGlow;
  }
  // באוויר הסקייטבורד נוטה: האף למעלה כשעולים, למטה כשיורדים
  let tilt = robot.onGround ? 0 : Math.max(-0.35, Math.min(0.35, robot.vy * 0.025));
  if (robot.onRamp) tilt = -Math.atan2(robot.onRamp.h, robot.onRamp.w);   // על הרמפה — נוטה כמו המדרון
  if (robot.crashed) tilt = 0.45;
  ctx.translate(x, y - 12);
  ctx.rotate(tilt);
  ctx.translate(-x, -(y - 12));

  // סלטה: מסובבים את כל הרובוט סביב האמצע של הגוף שלו.
  // המחשב סופר סיבובים ב"רדיאנים" ולא במעלות, אז ממירים: 180 מעלות = π (פאי)
  if (robot.flipping) {
    ctx.translate(x, y - 50);
    ctx.rotate(-robot.flipAngle * Math.PI / 180);   // מינוס = סלטה אחורה
    ctx.translate(-x, -(y - 50));
  }

  // --- 🛸 סקייטבורד מעופף: במקום גלגלים — שני מנועי סילון שזוהרים (חזק יותר כשמרחפים) ---
  if (look.board === "hover") {
    const power = robot.gliding ? 1.6 : 1;
    for (const jx of [x - 20, x + 20]) {
      const flick = 0.85 + 0.15 * Math.sin(now / 35 + jx);
      const jg = ctx.createRadialGradient(jx, y - 8, 1, jx, y - 6, 10 * power * flick);
      jg.addColorStop(0, "rgba(224, 247, 250, 0.95)");
      jg.addColorStop(0.4, "rgba(0, 229, 255, 0.7)");
      jg.addColorStop(1, "rgba(0, 229, 255, 0)");
      ctx.fillStyle = jg;
      ctx.beginPath(); ctx.ellipse(jx, y - 4, 9 * power, 7 * power * flick, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#37474f";                       // המנוע עצמו, מתחת לקרש
      roundRect(jx - 5, y - 13, 10, 5, 2);
      ctx.fill();
    }
  }
  // --- גלגלים (מסתובבים!) — בהירים בצד של השמש, כהים בצד השני ---
  for (const wx of (look.board === "hover" ? [] : [x - 20, x + 20])) {
    const wg = ctx.createRadialGradient(wx + 2, y - 8, 1, wx, y - 6, 6);
    wg.addColorStop(0, shade(WHEEL_COLOR, 0.6));
    wg.addColorStop(1, shade(WHEEL_COLOR, -0.3));
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.arc(wx, y - 6, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#795548";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wx - Math.cos(robot.wheelAngle) * 5, y - 6 - Math.sin(robot.wheelAngle) * 5);
    ctx.lineTo(wx + Math.cos(robot.wheelAngle) * 5, y - 6 + Math.sin(robot.wheelAngle) * 5);
    ctx.stroke();
  }

  // --- הסקייטבורד: קרש עם קצוות מורמים ---
  // מציירים אותו פעמיים: פעם כהה וקצת למטה (העובי של הקרש), ופעם רגיל מעליו
  function deckPath(dy) {
    ctx.beginPath();
    ctx.moveTo(x - 36, y - 21 + dy);
    ctx.quadraticCurveTo(x - 32, y - 13 + dy, x - 24, y - 13 + dy);
    ctx.lineTo(x + 24, y - 13 + dy);
    ctx.quadraticCurveTo(x + 32, y - 13 + dy, x + 36, y - 21 + dy);
  }
  const paint = boardPaint(look.board, x);        // 🛒 הסקייטבורד שקנינו בחנות
  ctx.lineCap = "round";
  ctx.lineWidth = 6;
  ctx.strokeStyle = paint.under;
  deckPath(3); ctx.stroke();
  ctx.strokeStyle = paint.main;
  deckPath(0); ctx.stroke();
  ctx.strokeStyle = paint.shine;                  // פס אור דק על הקרש
  ctx.lineWidth = 1.5;
  deckPath(-2); ctx.stroke();
  // 🔥 לסקייטבורד הלהבות יש אש קטנה מאחור כשנוסעים
  if (look.board === "flames" && !robot.crashed && (state === "playing" || lookOverride)) {
    const f = 7 + Math.sin(now / 40) * 3;
    ctx.fillStyle = "rgba(255, 112, 0, 0.85)";
    ctx.beginPath(); ctx.moveTo(x - 37, y - 22); ctx.lineTo(x - 37 - f * 1.7, y - 18); ctx.lineTo(x - 37, y - 14); ctx.fill();
    ctx.fillStyle = "rgba(255, 234, 0, 0.9)";
    ctx.beginPath(); ctx.moveTo(x - 37, y - 20); ctx.lineTo(x - 37 - f, y - 18); ctx.lineTo(x - 37, y - 16); ctx.fill();
  }

  // צבע של מתכת: כהה משמאל ומבריק מימין (השמש מימין)
  function metal(left, right, color) {
    const m = ctx.createLinearGradient(left, 0, right, 0);
    m.addColorStop(0, shade(color, -0.3));
    m.addColorStop(0.65, shade(color, 0.4));
    m.addColorStop(1, shade(color, 0.05));
    return m;
  }

  // --- רגליים וכפות רגליים ---
  ctx.fillStyle = metal(x - 12, x - 4, DARK);
  ctx.fillRect(x - 12, y - 34, 8, 18);
  ctx.fillStyle = metal(x + 4, x + 12, DARK);
  ctx.fillRect(x + 4, y - 34, 8, 18);
  ctx.fillStyle = "#546e7a";
  ctx.fillRect(x - 15, y - 20, 13, 4);
  ctx.fillRect(x + 2, y - 20, 13, 4);

  // --- ידיים: לצדדים לשיווי משקל, ולמעלה כשקופצים ---
  const armsUp = !robot.onGround || robot.crashed;
  const handY = armsUp ? y - 76 : y - 48;
  ctx.strokeStyle = DARK;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x - 16, y - 55); ctx.lineTo(x - 33, handY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 16, y - 55); ctx.lineTo(x + 33, handY); ctx.stroke();
  ctx.fillStyle = "#546e7a";
  ctx.beginPath(); ctx.arc(x - 33, handY, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 33, handY, 4.5, 0, Math.PI * 2); ctx.fill();

  // --- גוף מתכת מבריק, עם לוח קטן ושלוש נורות ---
  ctx.fillStyle = metal(x - 18, x + 18, BODY);
  roundRect(x - 18, y - 62, 36, 30, 6);
  ctx.fill();
  ctx.strokeStyle = DARK;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "rgba(255, 255, 255, 0.6)";     // הברק של המתכת
  roundRect(x + 10, y - 59, 3, 22, 1.5);
  ctx.fill();
  ctx.fillStyle = "#eceff1";
  ctx.fillRect(x - 11, y - 55, 22, 12);
  const lights = ["#ff1744", "#ffea00", "#00e676"];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = lights[i];
    ctx.beginPath(); ctx.arc(x - 6 + i * 6, y - 49, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // --- צוואר וראש ---
  ctx.fillStyle = DARK;
  ctx.fillRect(x - 4, y - 67, 8, 6);
  ctx.fillStyle = metal(x - 16, x + 16, BODY);
  roundRect(x - 16, y - 90, 32, 24, 6);
  ctx.fill();
  ctx.strokeStyle = DARK;
  ctx.stroke();

  // --- המשקף והעיניים ---
  const visor = ctx.createLinearGradient(0, y - 85, 0, y - 74);
  visor.addColorStop(0, "#455a64");
  visor.addColorStop(1, "#102027");
  ctx.fillStyle = visor;
  roundRect(x - 12, y - 85, 24, 11, 4);
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";  // השתקפות קטנה בזכוכית
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x + 3, y - 84); ctx.lineTo(x + 9, y - 84); ctx.stroke();
  if (robot.crashed) {
    // עיניים של X כשנתקעים
    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 2;
    for (const ex of [x - 5, x + 6]) {
      ctx.beginPath();
      ctx.moveTo(ex - 3, y - 82); ctx.lineTo(ex + 3, y - 77);
      ctx.moveTo(ex + 3, y - 82); ctx.lineTo(ex - 3, y - 77);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = ROBOT_EYES_COLOR;
    ctx.shadowColor = ROBOT_EYES_COLOR;           // העיניים זוהרות
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(x - 5, y - 79.5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 6, y - 79.5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = GHOST_GLOW_COLOR;           // חוזרים להילה של הרפאים (או בלי הילה)
    ctx.shadowBlur = ghostGlow;
  }
  // חיוך קטן (או פה עצוב כשנתקעים)
  ctx.strokeStyle = "#455a64";
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (robot.crashed) ctx.arc(x, y - 66, 4, 1.15 * Math.PI, 1.85 * Math.PI);
  else ctx.arc(x, y - 73, 4, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  // --- אנטנה עם נורה מהבהבת (או כובע מהחנות במקומה) ---
  if (look.hat !== "none") {
    drawHat(look.hat, x, y);
  } else {
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - 90); ctx.lineTo(x, y - 99); ctx.stroke();
    const blink = Math.floor(now / 400) % 2 === 0;
    ctx.fillStyle = blink ? ANTENNA_LIGHT_COLOR : "#ff8a80";
    ctx.beginPath(); ctx.arc(x, y - 102, 4, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

// 👀 חלון המדידה בחנות: מציירים את הרובוט בגדול, עם מה שהוא מודד עכשיו
function drawShopPreview(now) {
  const pc = document.getElementById("shopPreview");
  if (!pc) return;
  const pctx = pc.getContext("2d");
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.clearRect(0, 0, pc.width, pc.height);
  pctx.fillStyle = "#cfd8dc";                       // רצפה קטנה
  pctx.fillRect(0, pc.height - 14, pc.width, 14);
  // מזיזים את הרובוט לרגע לחלון המדידה, מציירים, ומחזירים אותו למקום
  const saved = { x: robot.x, y: robot.y, vy: robot.vy, onGround: robot.onGround, flipping: robot.flipping,
                  crashed: robot.crashed, onRamp: robot.onRamp };
  Object.assign(robot, { x: 56, y: 118, vy: 0, onGround: true, flipping: false, crashed: false, onRamp: null });
  lookOverride = shopTry;
  ctx = pctx;
  pctx.setTransform(1.3, 0, 0, 1.3, 2, 4);          // בגדול: פי 1.3
  // ✨ השובל שהרובוט מודד — כמה נקודות צבעוניות מאחורי הסקייטבורד
  if (shopTry.trail && shopTry.trail !== "none") {
    const fancy = findItem("trail", shopTry.trail);
    const dots = fancy && fancy.colors ? fancy.colors.concat(fancy.colors.slice(0, 2)) :
                 shopTry.trail === "rainbow" ? ["#8e24aa", "#1e88e5", "#43a047", "#fdd835", "#fb8c00", "#e53935"]
                                             : ["#fff59d", "#ffd600", "#ffe082", "#ffd600", "#fff59d", "#ffb300"];
    for (let i = 0; i < dots.length; i++) {
      pctx.fillStyle = dots[i];
      pctx.globalAlpha = 0.35 + i * 0.11;
      pctx.beginPath(); pctx.arc(1 + i * 3.4, 104 + Math.sin(now / 200 + i) * 2, 2.4, 0, Math.PI * 2); pctx.fill();
    }
    pctx.globalAlpha = 1;
  }
  drawRobot(now);
  ctx = mainCtx;
  lookOverride = null;
  Object.assign(robot, saved);
}

function drawPopups() {
  ctx.font = "bold 24px 'Segoe UI', Arial";
  ctx.textAlign = "center";
  for (const p of popups) {
    ctx.direction = p.dir;
    ctx.globalAlpha = Math.max(0, p.life);   // הכיתוב נהיה שקוף לאט לאט
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.direction = "inherit";
}

// ------------------------------------------------------------
//  🔁 לולאת המשחק: רצה שוב ושוב, בערך 60 פעמים בשנייה
// ------------------------------------------------------------
let lastTime = performance.now();
function loop(now) {
  // dt = כמה זמן עבר מאז הפעם הקודמת (1 = רגע רגיל), כדי שהמשחק ירוץ
  // באותה מהירות בכל מחשב — גם במסך מהיר וגם במסך איטי
  let dt = (now - lastTime) / 16.667;
  lastTime = now;
  if (dt > 3) dt = 3;     // אם הלשונית הייתה ברקע — לא קופצים קדימה בבת אחת

  if (state === "playing") update(dt);
  draw(now);
  if (shopOpen) drawShopPreview(now);   // 🛒 הרובוט בחלון המדידה של החנות
  requestAnimationFrame(loop);
}

updateScoreboard();
showStartScreen();
requestAnimationFrame(loop);
</script>
